<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","SF Pro Display","Microsoft YaHei",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;text-align:center;
  background:linear-gradient(135deg,#f0f2f5,#e4e8ee);
}
.card{
  background:rgba(255,255,255,0.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:28px;padding:50px 40px 36px;max-width:460px;width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.06),0 0 0 1px rgba(255,255,255,0.8);
  animation:cardIn 0.8s cubic-bezier(0.15,0.85,0.35,1) forwards;
}


.badge-wrap{position:relative;width:80px;height:80px;margin:0 auto 8px;perspective:800px}
.badge-glass{
  width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95) 0%,rgba(230,240,255,0.6) 40%,rgba(200,215,240,0.3) 70%,rgba(180,200,230,0.15) 100%);
  backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,0.8);
  box-shadow:0 8px 32px rgba(71,133,168,0.12),inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(0,0,0,0.04);
  display:flex;align-items:center;justify-content:center;
  transform:rotateX(6deg) rotateY(-8deg);
  animation:badgeFloat 5s ease-in-out infinite 0.5s;overflow:hidden
}
.badge-logo{width:65%;height:65%;object-fit:contain;border-radius:50%;transform:translateZ(4px)}
.badge-glass::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,0.5) 30%,transparent 60%,rgba(255,255,255,0.2) 80%,transparent 100%);
  animation:badgeShimmer 4s ease-in-out infinite 0.8s;z-index:1
}
@keyframes badgeFloat{0%,100%{transform:rotateX(6deg) rotateY(-8deg) translateY(0)}50%{transform:rotateX(6deg) rotateY(-8deg) translateY(-4px)}}
@keyframes badgeShimmer{0%,100%{transform:rotate(0deg);opacity:0.5}50%{transform:rotate(180deg);opacity:1}}
.brand-title{
  font-size:clamp(30px,7.5vw,48px);font-weight:800;line-height:1.2;margin:4px 0 6px;white-space:nowrap;
  background:linear-gradient(135deg,#4785a8,#c4956a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:brandReveal 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards
}
@keyframes brandReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sub-text{color:#86868b;font-size:14px;margin:4px 0 14px;animation:fadeUp 0.5s ease-out 0.6s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.enter-area{margin-top:4px;animation:fadeUp 0.5s ease-out 0.9s forwards}
.enter-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:13px 34px;border-radius:999px;font-size:15px;font-weight:600;
  background:rgba(71,133,168,0.1);backdrop-filter:blur(12px);
  border:1px solid rgba(71,133,168,0.2);
  color:#4785a8;cursor:pointer;text-decoration:none;
  box-shadow:0 2px 12px rgba(71,133,168,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);user-select:none
}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(71,133,168,0.18)}
.enter-btn:active{transform:scale(0.96)}
.enter-btn.loading{pointer-events:none;opacity:0.7}
.bookmark-tip{color:#aeaeb2;font-size:11px;margin-top:8px;animation:fadeUp 0.4s ease-out 1.1s forwards}
.pwa-area{margin-top:14px;padding-top:14px;animation:fadeUp 0.5s ease-out 1.3s forwards}
.pwa-btn{background:none;border:none;font-size:12px;color:#86868b;cursor:pointer;padding:6px 14px;border-radius:8px;transition:all 0.3s}
.pwa-btn:hover{background:rgba(0,0,0,0.04);color:#4785a8}
.pwa-btn.installed{color:#34c759;cursor:default}
/* 🔄 连接进度条 - 小字+百分比+动画 */
.progress-area{min-height:44px;margin-top:10px;opacity:0;transition:opacity 0.3s;display:none}
.progress-area.show{display:block;opacity:1}
.progress-text{font-size:12px;color:#8e8e93;margin-bottom:6px;transition:color 0.3s}
.progress-text.done{color:#34c759}
.progress-bar{border-radius:4px;height:3px;background:rgba(0,0,0,0.06);overflow:hidden;margin:0 auto;width:180px}
.progress-fill{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#8fc1b5);
  background-size:200% 100%;
  transition:width 0.4s cubic-bezier(0.25,0.1,0.25,1);
  animation:gradShift 1.5s linear infinite}
.progress-fill.complete{background:linear-gradient(90deg,#34c759,#30d158);animation:none}
@keyframes gradShift{to{background-position:200% 0}}
.btn-err{color:#e74c3c;font-size:12px;margin-top:8px;min-height:18px;display:none}
.btn-err.show{display:block;animation:fadeUp 0.3s ease-out}
</style>

<body>
<!-- 🎬 开场动画层（点进入系统后播放） -->
<div id="introOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#0A0A0F;">
  <video id="introVideo" autoplay muted playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;-webkit-transform:translateZ(0);transform:translateZ(0);">
    <!-- 设备自适应：手机→竖屏 / 电脑→横屏（JS动态设置src） -->
  </video>
  <button id="introSkip" onclick="skipIntro()" style="position:fixed;bottom:28px;right:28px;z-index:10;padding:10px 26px;border-radius:999px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:2px;font-family:'PingFang SC','Hiragino Sans GB',sans-serif;">跳 过  ›</button>
</div>
<div class="card">
  <div class="badge-wrap">
    <div class="badge-glass"><img class="badge-logo" src="/lebacenter/logo.jpg" alt="乐吧公益中心"></div>

      <div class="progress-text" id="progressText">⏳ 正在连接...</div>

    </div>

</div>

<script>
// ===== 🍎 下拉刷新 =====
(function(){var b=document.body;if(!('ontouchstart'in window))return;var i=document.createElement('div');i.id='ptr-entry';i.innerHTML='<div style=\"width:22px;height:22px;border:3px solid rgba(71,133,168,0.15);border-top-color:#4785a8;border-radius:50%;margin-bottom:2px;\" class=\"ptr-spin\"></div><div style=\"font-size:11px;color:#86868b;\" class=\"ptr-text\">↓ 下拉刷新</div>';b.insertBefore(i,b.firstChild);var s=document.createElement('style');s.textContent='#ptr-entry{position:fixed;top:-60px;left:0;right:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:60px;padding-bottom:8px;background:rgba(245,245,247,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:top .35s cubic-bezier(0.25,0.1,0.25,1);pointer-events:none;}#ptr-entry.show{top:0;}#ptr-entry.ready .ptr-text{color:#4785a8;}#ptr-entry:not(.ready) .ptr-spin{animation:none;border-top-color:#4785a8!important;}#ptr-entry.refreshing .ptr-text{color:#4785a8;}@keyframes ptrSpin{to{transform:rotate(360deg);}}.ptr-spin{animation:ptrSpin .6s linear infinite;}';document.head.appendChild(s);var sy=0,pl=false;b.addEventListener('touchstart',function(e){var st=window.pageYOffset||document.documentElement.scrollTop||b.scrollTop||0;if(st>0){sy=0;return;}sy=e.touches[0].clientY;pl=true;i.classList.remove('ready','refreshing');i.classList.add('show');i.querySelector('.ptr-text').textContent='↓ 下拉刷新';},{passive:true});b.addEventListener('touchmove',function(e){if(!pl||!sy)return;var y=e.touches[0].clientY,md=y-sy;if(md<0){i.classList.remove('show','ready');pl=false;return;}i.style.top=Math.min(0,-60+md*0.4)+'px';if(md>80&&!i.classList.contains('ready')){i.classList.add('ready');i.querySelector('.ptr-text').textContent='松开刷新';}else if(md<=80){i.classList.remove('ready');i.querySelector('.ptr-text').textContent='↓ 下拉刷新';}},{passive:true});b.addEventListener('touchend',function(){if(!pl)return;pl=false;if(i.classList.contains('ready')){i.classList.remove('ready');i.classList.add('refreshing');i.querySelector('.ptr-text').textContent='刷新中…';i.style.top='0px';window.location.reload();}else{i.classList.remove('show');i.style.top='-60px';}sy=0;},{passive:true});})();

// ===== 🎬 预加载优化 2026-08-03: 页面打开即后台下载视频+url.json，点击秒开 =====
(function(){
  // 1) 预下载开场视频（按设备选源），进入系统时浏览器已缓存 → 播放零等待
  // APK的__isLebaApk标记在onPageFinished注入，这里轮询等待（最多1.5s）确保选对源
  var tries = 0;
  (function waitForApkFlag(){
    var v = document.getElementById('introVideo');
    if(v && (window.__isLebaApk !== undefined || tries >= 15)){
      v.preload = 'auto';
      v.src = pickIntroVideo();
      v.load();
      // 🔑 v8: 页面加载即后台fetch视频 → SW拦截→下载并写入缓存（第一次打开就缓存，第二次直接读缓存秒开）
      // 🔴 v51【Boss定】APK永远走内置缓存动画，绝不下载！标记+URL参数双保险判断，
      //   只有【真·网页版】才预下载；APK（标记或&apk=1）一律跳过fetch
      var isWebViewFlag = window.__isLebaApk === true || /[?&]apk=1/.test(location.search);
      if(!isWebViewFlag && 'serviceWorker' in navigator && navigator.serviceWorker.controller){
        fetch(v.src, {mode:'cors'}).catch(function(){});
      }
      return;
    }
    tries++;
    setTimeout(waitForApkFlag, 100);
  })();
  // 2) 预拉取url.json，点击时直接用缓存结果（避免1.5s+网络等待）
  window._cachedTunnelUrl = null;
  fetch('/lebacenter/url.json?t='+Date.now(), {cache:'no-store'})
    .then(function(r){return r.ok ? r.json() : null;})
    .then(function(d){ if(d && d.url && d.url.length>5) window._cachedTunnelUrl = d.url; })
    .catch(function(){});
})();

// ===== 入口: 点按钮→检测→触发自愈→更新url.json→强刷CDN→跳转 =====
var URL_JSON = '/lebacenter/url.json';
var btn = document.getElementById('enterBtn');
var errEl = document.getElementById('btnErr');
var progArea = document.getElementById('progressArea');
var progText = document.getElementById('progressText');
var progFill = document.getElementById('progressFill');
var progPct = document.getElementById('progressPct');

function setProgress(pct, msg){
  progArea.style.display = 'block';
  setTimeout(function(){progArea.classList.add('show');}, 10);
  progFill.style.width = pct + '%';
  progPct.textContent = Math.round(pct) + '%';
  if(msg) progText.textContent = msg;
}

function fetchTunnelUrl(){
  // 优先用预拉取的缓存，避免重复网络等待
  if(window._cachedTunnelUrl) return Promise.resolve(window._cachedTunnelUrl);
  return fetch(URL_JSON+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){if(!d||!d.url||d.url.length<5)throw new Error('无效地址');return d.url;});
}

function doRedirect(baseUrl){
  btn.textContent = '🔄 跳转中...';
  setProgress(5, '⬇️ 缓存开场动画...');
  setTimeout(function(){
    var target = (baseUrl||'').replace(/\/+$/,'') + '/gateway/';
    // 🔑 v8: 点按钮先真实下载视频（XHR进度可见）→ 写入缓存 → 才播放跳转
    ensureVideoCached().then(function(){
      progFill.classList.add('complete');
      progText.classList.add('done');
      setProgress(100, '✅ 动画已就绪，即将进入系统');
      playIntroThenGo(target);
    });
  }, 300);
}

// 🔑 v8: 真实下载开场视频到浏览器缓存（XHR进度实时显示，SW拦截自动写入CacheStorage）
//    不依赖 serviceWorker.controller——首次访问SW未接管时也正常下载（走HTTP缓存）
function ensureVideoCached(){
  // 🔴 v48修复【Boss实测：APK装v49还走线上下载】：
  //   旧代码只查 window.__isLebaApk 标记——但标记是 onPageStarted 异步注入的，
  //   用户快速点「进入系统」时标记可能还没到 → 误走XHR下载CDN视频 → 卡！
  //   必须标记 + URL参数(&apk=1) 双保险判断（URL参数在页面加载时就可见）
  if(window.__isLebaApk || /[?&]apk=1/.test(location.search)) return Promise.resolve();  // APK内置视频，无需缓存
  var url = pickIntroVideo();
  return new Promise(function(resolve){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'blob';
    xhr.onprogress = function(e){
      if(e.lengthComputable && e.total > 0){
        var pct = Math.min(98, Math.round(e.loaded/e.total*100));
        setProgress(pct, '⬇️ 缓存开场动画 ' + pct + '% (' + Math.round(e.loaded/1024/1024) + '/' + Math.round(e.total/1024/1024) + 'MB)');
      } else {
        setProgress(90, '⬇️ 缓存开场动画中...');
      }
    };
    xhr.onload = function(){
      // 下载完成（可能命中HTTP缓存瞬间完成）
      setProgress(99, '⬇️ 缓存完成');
      resolve();
    };
    xhr.onerror = function(){ resolve(); };  // 下载失败不阻塞跳转，走原回退链
    xhr.send();
  });
}

// 🎬 开场动画：按设备选视频源（手机→竖屏 / 电脑→横屏）→ 播完/跳过/兜底 → 进登录页
var introDone = false;
function pickIntroVideo(){
  var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  // APK检测（2026-08-03修复）：只用APK注入的专属标记，不用UA猜！
  // ⚠️ 不能用 /Version\\/4\\.0/ 检测——微信安卓版UA也含Version/4.0，会被误判成APK
  // v38: 双保险——标记(window.__isLebaApk) + URL参数(&apk=1)。URL参数在页面加载时就可见，不依赖注入时序
  var isWebView = window.__isLebaApk === true || /[?&]apk=1/.test(location.search);
  if (isWebView) {
    // v46 设备分级：MainActivity用MediaCodecList探测注入 window.__videoTier
    //   high=1080p High 6.5MB / mid=1080p Main 2.8MB / low=720p Main 1.7MB
    //   全部内置在APK assets/intro/，appassets协议被shouldInterceptRequest拦截→本地读取GPU硬解
    var tier = window.__videoTier || 'mid';
    return 'https://appassets.androidplatform.net/assets/intro/intro_' + tier + '.mp4';
  }
  // 网页版/回退源：jsDelivr CDN(国内节点)
  // 2026-08-04 统一到最新：手机→leba_intro_v_hd.mp4(1080p) / 电脑→leba_intro_h_v2.mp4(绿金小球)
  var file = isMobile ? 'leba_intro_v_hd.mp4' : 'leba_intro_h_v2.mp4';
  return 'https://cdn.jsdelivr.net/gh/mars1417/lebacenter@0d1d1b3/' + file;
}
function playIntroThenGo(target){
  window._introTarget = target;
  var ov = document.getElementById('introOverlay');
  var v = document.getElementById('introVideo');
  if(!ov || !v){ window.location.href = target; return; }
  function go(){
    if(introDone) return;
    introDone = true;
    window.location.href = target;
  }
  // 🎬 v45【Boss定】视频必须放完(ended)→淡出→才跳转！移除13.5s强制跳、移除play失败3次就go
  // 🔊 v47【Boss定】要有声音！点击进入系统=用户手势→浏览器允许有声自动播放→取消静音，音乐响起
  v.muted = false;
  v.volume = 1.0;
  v.src = pickIntroVideo();
  v.load();
  // 慢放0.8倍（10s→12.5s），更从容的入场节奏
  try { v.playbackRate = 0.8; } catch(e){}
  // 渐入渐出——淡入0.8s，播完淡出0.8s
  v.style.opacity = '0';
  v.style.transition = 'opacity 0.8s ease';
  v.style.willChange = 'opacity';
  ov.style.display = 'block';

  var started = false;
  function attemptPlay(){
    if(introDone) return;
    var p;
    try { p = v.play(); } catch(e){ p = Promise.reject(e); }
    if(p && p.catch){
      p.then(function(){
        v.style.opacity = '1';  // 播放成功 → 淡入
      }).catch(function(){
        // ⚠️ v45: play失败【不跳转】！只是视频未就绪/有声被浏览器拦截，1s后重试等待就绪
        // 🔊 v47: 若因有声播放被自动播放策略拦截 → 退回静音保画面，用户首次触摸/点击即开声
        if(!v.muted){
          v.muted = true;
          var enableSound = function(){ v.muted = false; v.volume = 1.0; try{ v.play(); }catch(e){} };
          document.addEventListener('touchstart', enableSound, {once:true});
          document.addEventListener('click', enableSound, {once:true});
        }
        setTimeout(attemptPlay, 1000);
      });
    } else {
      v.style.opacity = '1';
    }
  }
  function onCanPlay(){
    if(started || introDone) return;
    started = true;
    v.removeEventListener('canplay', onCanPlay);
    v.removeEventListener('loadeddata', onLoadedData);
    attemptPlay();
  }
  function onLoadedData(){
    if(started || introDone) return;
    started = true;
    v.removeEventListener('canplay', onCanPlay);
    v.removeEventListener('loadeddata', onLoadedData);
    attemptPlay();
  }
  v.addEventListener('canplay', onCanPlay);
  v.addEventListener('loadeddata', onLoadedData);
  // 兜底就绪：1.5秒后视频还没就绪也直接尝试播放（可能是缓存视频，事件不再触发）
  setTimeout(function(){
    if(!started && !introDone){ onLoadedData(); }
  }, 1500);

  // 🔑 v45【Boss定】视频放完(ended) → 淡出 → 跳转，不放完不到下一步
  v.onended = function(){
    v.style.opacity = '0';  // 淡出
    setTimeout(go, 600);    // 等淡出完成再跳
  };
  // 视频加载失败 → 三级回退：①jsDelivr → ②GP直连 → ③go()（本地都失败才跳）
  // 🔴 v51【Boss定】APK永远走内置缓存动画，绝不下载！
  //   旧逻辑：APK内置失败 → 回退CDN jsDelivr/GP直连 → 就是"每次登录下载视频"的真凶！
  //   新逻辑：APK(标记或&apk=1) → 内置失败只【重试内置】，绝不走CDN；网页版才保留三级回退
  var isWebViewFlag = window.__isLebaApk === true || /[?&]apk=1/.test(location.search);
  var cdnTried = false, gpTried = false, apkRetried = false;
  v.onerror = function(){
    var isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
    var file = isMobile ? 'leba_intro_v_hd.mp4' : 'leba_intro_h_v2.mp4';
    if(isWebViewFlag){
      // 🚀 APK：内置视频失败 → 重新load内置（可能是解码器未就绪/临时错误），最多重试1次
      //   绝不回退CDN！APK就是纯内置播放器
      if(!apkRetried){
        apkRetried = true;
        var tier2 = window.__videoTier || 'mid';
        v.src = 'https://appassets.androidplatform.net/assets/intro/intro_' + tier2 + '.mp4';
        v.load();
        started = false;
        v.addEventListener('canplay', function(){ onLoadedData(); });
        setTimeout(function(){ if(!started && !introDone) onLoadedData(); }, 800);
        return;
      }
      go();  // 内置重试仍失败 → 直接进系统（不卡死）
      return;
    }
    if(!cdnTried){
      cdnTried = true;
      v.src = 'https://cdn.jsdelivr.net/gh/mars1417/lebacenter@0d1d1b3/' + file;
      v.load();
      started = false;
      v.addEventListener('canplay', function(){ onLoadedData(); });
      setTimeout(function(){ if(!started && !introDone) onLoadedData(); }, 800);
      return;
    }
    if(!gpTried){
      gpTried = true;
      v.src = 'https://mars1417.github.io/lebacenter/' + file;
      v.load();
      started = false;
      v.addEventListener('canplay', function(){ onLoadedData(); });
      setTimeout(function(){ if(!started && !introDone) onLoadedData(); }, 800);
      return;
    }
    go();  // 所有源都失败才跳（v45: 极端情况才跳，不再13.5s硬跳）
  };
  // v45: 极端防死锁兜底——本地视频正常12.5s播完+淡出0.8s≈13.5s内必然ended。
  //   20s仅防止视频文件损坏/解码器异常导致永不ended时卡死（正常永远不会触发）
  setTimeout(go, 20000);
}
function skipIntro(){
  var v = document.getElementById('introVideo');
  var target = (window._introTarget || '');
  if(target){ window.location.href = target; return; }
  // 没存target时直接按原逻辑走：跳回网关
  if(v) v.pause();
  window.location.href = '/gateway/';
}

function pollHealStatus(baseUrl){
  var totalTime = 0;
  function check(){
    fetch(baseUrl + '/api/heal-status?t='+Date.now(), {signal:AbortSignal.timeout(6000)})
      .then(function(r){return r.json();})
      .then(function(d){
        var p = d.progress || 0;
        var msg = d.message || '处理中...';
        setProgress(Math.min(p, 95), msg);
        if(p >= 100){
          // 自愈完成！从CDN重新读取最新的url.json
          setProgress(97, '✅ 更新入口配置...');
          fetchTunnelUrl().then(function(newUrl){
            if(newUrl && newUrl.length>5 && newUrl !== baseUrl){
              setProgress(99, '🔄 发现新地址，跳转中...');
              doRedirect(newUrl);
            } else {
              doRedirect(baseUrl);
            }
          }).catch(function(){doRedirect(baseUrl);});
        } else if(p < 0){
          setProgress(90, '⚠️ 自愈异常');
          setTimeout(function(){doRedirect(baseUrl);}, 1000);
        } else {
          totalTime += 1500;
          if(totalTime > 120000){doRedirect(baseUrl);return;}
          setTimeout(check, 1500);
        }
      })
      .catch(function(){
        if(totalTime > 120000){doRedirect(baseUrl);return;}
        totalTime += 1500;
        setTimeout(check, 1500);
      });
  }
  setTimeout(check, 1500);
}

btn.addEventListener('click', function(e){
  e.preventDefault();
  btn.textContent = '⏳ 连接中...';
  btn.classList.add('loading');
  errEl.classList.remove('show');
  errEl.textContent = '';

  setProgress(5, '⏳ 获取入口配置...');

  // Step 1: 读取当前url.json
  fetchTunnelUrl()
    .then(function(url){
      setProgress(15, '🔍 检测网关连通性...');
      // Step 2: 检测网关是否可达
      return fetch(url+'/api/health', {signal:AbortSignal.timeout(6000)})
        .then(function(r){
          if(!r.ok) throw new Error('health fail');
          setProgress(20, '🔄 启动自愈检测...');
          // Step 3: 触发后端自愈（检测最新隧道→更新url.json→推送到CDN）
          return fetch(url+'/api/heal', {method:'POST', signal:AbortSignal.timeout(8000)});
        })
        .then(function(r){return r.json();})
        .then(function(d){
          if(d && d.ok){
            setProgress(25, '🔄 检测最新隧道...');
            pollHealStatus(url);
          } else {
            doRedirect(url);
          }
        })
        .catch(function(){
          // 网关可达但heal接口异常，直接跳
          setProgress(80, '🚀 即将进入系统...');
          doRedirect(url);
        });
    })
    .catch(function(err){
      // url.json都读不到 → 系统完全不可达
      btn.textContent = '进入系统';
      btn.classList.remove('loading');
      progArea.style.display = 'none';
      progArea.classList.remove('show');
      errEl.textContent = '⚠️ 系统暂时不可达，请稍后再试';
      errEl.classList.add('show');
      console.error('入口失败:', err);
    });
});

    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(r){
      if(r.outcome==='accepted')console.log('PWA installed');
      deferredPrompt=null;
    });
  }else alert('请在浏览器菜单中点击「添加到主屏幕」');
}
