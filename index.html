<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/lebacenter/manifest.json">
<title>乐吧公益中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;width:100%;height:100%;background:#121016}
body{font-family:"PingFang SC","SF Pro Display","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;position:relative}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;pointer-events:none}
.card{background:rgba(248,244,238,0.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:28px;padding:50px 40px 36px;max-width:460px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,0.06),0 0 0 1px rgba(255,255,255,0.8);opacity:0;transform:scale(0.95);position:relative;overflow:hidden;transition:none;pointer-events:none;z-index:2}
.card.show{animation:cardIn 1.2s cubic-bezier(0.15,0.85,0.35,1) forwards;pointer-events:auto}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#4785a8,#6da8a0,#8fc1b5,#6da8a0,#4785a8);background-size:200% 100%;animation:waveShift 4s ease-in-out infinite}
@keyframes waveShift{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
@keyframes cardIn{from{opacity:0;transform:scale(0.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.badge-wrap{position:relative;width:80px;height:80px;margin:0 auto 8px;perspective:800px}
.badge-glass{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95) 0%,rgba(230,240,255,0.6) 40%,rgba(200,215,240,0.3) 70%,rgba(180,200,230,0.15) 100%);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,0.8);box-shadow:0 8px 32px rgba(71,133,168,0.12),inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(0,0,0,0.04);display:flex;align-items:center;justify-content:center;transform:rotateX(6deg) rotateY(-8deg);transition:transform 0.4s cubic-bezier(0.25,0.1,0.25,1);animation:badgeFloat 5s ease-in-out infinite 0.5s;overflow:hidden}
.badge-logo{width:65%;height:65%;object-fit:contain;border-radius:50%;transform:translateZ(4px)}
.badge-glass::before{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,0.5) 30%,transparent 60%,rgba(255,255,255,0.2) 80%,transparent 100%);animation:badgeShimmer 4s ease-in-out infinite 0.8s;z-index:1}
.badge-shadow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:60px;height:12px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,0.06),transparent);animation:shadowPulse 5s ease-in-out infinite 0.5s}
@keyframes badgeFloat{0%,100%{transform:rotateX(6deg) rotateY(-8deg) translateY(0)}50%{transform:rotateX(6deg) rotateY(-8deg) translateY(-4px)}}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(0.85);opacity:0.6}}
@keyframes badgeShimmer{0%,100%{transform:rotate(0deg);opacity:0.5}50%{transform:rotate(180deg);opacity:1}}
.brand-title{font-size:clamp(30px,7.5vw,48px);font-weight:800;line-height:1.2;margin:4px 0 6px;white-space:nowrap;background:linear-gradient(135deg,#4785a8,#c4956a);background-size:200% 100%;background-position:100% 0;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;transform:translateY(10px) scale(0.96);animation:brandReveal 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards}
@keyframes brandReveal{0%{opacity:0;transform:translateY(10px) scale(0.96);background-position:100% 0}60%{opacity:1;transform:translateY(0) scale(1);background-position:60% 0}100%{opacity:1;transform:translateY(0) scale(1);background-position:0% 0}}
.brand-title.glow{animation:brandGlow 3s ease-in-out infinite 1.5s,brandReveal 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards}
@keyframes brandGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(71,133,168,0.10))}50%{filter:drop-shadow(0 0 14px rgba(196,149,106,0.20))}}
.sub-text{color:#86868b;font-size:14px;margin:4px 0 14px;opacity:0;transform:translateY(6px);animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 0.6s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.enter-area{opacity:0;transform:translateY(8px);animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 0.9s forwards;margin-top:4px}
.enter-btn{display:inline-flex;align-items:center;gap:6px;padding:13px 34px;border-radius:999px;font-size:15px;font-weight:600;background:rgba(71,133,168,0.1);backdrop-filter:blur(12px);border:1px solid rgba(71,133,168,0.2);color:#4785a8;cursor:pointer;text-decoration:none;box-shadow:0 2px 12px rgba(71,133,168,0.08),inset 0 1px 0 rgba(255,255,255,0.9);transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);user-select:none;position:relative;overflow:hidden}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(71,133,168,0.18)}
.enter-btn:active{transform:scale(0.96)}
.bookmark-tip{color:#aeaeb2;font-size:11px;margin-top:8px;opacity:0;animation:fadeUp 0.4s ease-out 1.1s forwards}
.pwa-area{margin-top:14px;padding-top:14px;opacity:0;animation:fadeUp 0.5s ease-out 5s forwards}
.pwa-btn{background:none;border:none;font-size:12px;color:#86868b;cursor:pointer;padding:6px 14px;border-radius:8px;transition:all 0.3s}
.pwa-btn:hover{background:rgba(0,0,0,0.04);color:#4785a8}
.pwa-btn.installed{color:#34c759;cursor:default}
</style>
</head>
<body>
<canvas id="mainCanvas"></canvas>
<div class="card" id="mainCard">
  <div class="badge-wrap">
    <div class="badge-glass"><img class="badge-logo" src="/lebacenter/logo.jpg" alt="乐吧公益中心"></div>
    <div class="badge-shadow"></div>
  </div>
  <div class="brand-title" id="brandTitle">乐吧公益中心</div>
  <div class="sub-text">轻触进入 · 乐吧系统</div>
  <div class="enter-area">
    <a href="https://1fbf9a17.r23.cpolar.top/gateway/" class="enter-btn" id="enterBtn">进入系统</a>
    <div class="bookmark-tip">📌 收藏此页面，随时回来</div>
    <div class="pwa-area" id="pwaArea">
      <button class="pwa-btn" id="pwaBtn" onclick="installPWA()">📲 安装到主屏幕</button>
    </div>
  </div>
</div>

<script>
// ===== Canvas统一渲染引擎 =====
var canvas=document.getElementById('mainCanvas');
var ctx=canvas.getContext('2d');
var W,H, POLY=0;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
}
resize(); window.addEventListener('resize',resize);

var MODE='intro';
var introElapsed=0, healProgress=0, healMessage='', cardShown=false;
var urlPromise=null, URL_JSON='/lebacenter/url.json', target='', baseUrl='';
var btn=document.getElementById('enterBtn');

// ===== easeOutCubic 平滑曲线 =====
function smoothPct(raw){var t=Math.min(1,raw/100);return 1-Math.pow(1-t,3);}

// ===== 预生成草形数据（不再每帧随机） =====
var grassData=[];
for(var i=0;i<200;i++){
  var x=i*Math.max(3,W/200);
  grassData.push({x:x,h:20+Math.random()*28,curve1:-2+Math.random()*4,curve2:-4+Math.random()*8});
}

// ===== 粒子 =====
var particles=[];
for(var i=0;i<Math.min(80,Math.floor(window.innerWidth*0.06));i++){
  particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.3,vy:-(Math.random()*0.2+0.05),size:Math.random()*2.5+0.8,hue:i%2===0?32:220,alpha:Math.random()*0.3+0.1,phase:Math.random()*Math.PI*2});
}

var leafParticles=[];
for(var i=0;i<60;i++){
  var a=Math.random()*Math.PI*2, d=20+Math.random()*80;
  leafParticles.push({baseAngle:a,baseDist:d,size:4+Math.random()*8,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.02,hue:90+Math.random()*40,sat:40+Math.random()*30,light:45+Math.random()*25,swayPhase:Math.random()*Math.PI*2,swaySpeed:0.5+Math.random()*0.8,swayAmp:1+Math.random()*3,alpha:0.5+Math.random()*0.5});

}
var clouds=[];
for(var i=0;i<4;i++){
  clouds.push({x:Math.random()*W,y:10+Math.random()*H*0.15,w:60+Math.random()*120,speed:0.08+Math.random()*0.12,alpha:0.08+Math.random()*0.1});
}

var fireflies=[];
for(var i=0;i<15;i++){
  fireflies.push({x:Math.random()*W,y:Math.random()*H*0.8,vx:(Math.random()-0.5)*0.15,vy:-0.05-Math.random()*0.1,size:1.5+Math.random()*2,phase:Math.random()*Math.PI*2,alpha:0,flickerSpeed:1+Math.random()*2});
}

var petals=[];
for(var i=0;i<10;i++){
  petals.push({x:Math.random()*W,y:Math.random()*H*0.4,vx:(Math.random()-0.5)*0.3,vy:0.2+Math.random()*0.3,size:3+Math.random()*4,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.05,alpha:0});
}

// ===== 绘制函数 =====
function drawSky(pct,t){
  var p=Math.min(1,pct);
  var r,g,b;
  if(p<0.3){var t0=p/0.3;r=24+(80-24)*t0;g=16+(50-16)*t0;b=30+(100-30)*t0;}
  else if(p<0.7){var t1=(p-0.3)/0.4;r=80+(135-80)*t1;g=50+(160-50)*t1;b=100+(200-100)*t1;}
  else{var t2=(p-0.7)/0.3;r=135+(200-135)*t2;g=160+(140-160)*t2;b=200+(100-200)*t2;}
  var sa=(p-0.15)*Math.PI, sx=W*0.3+Math.cos(sa)*W*0.3, sy=H*0.7-Math.sin(sa)*H*0.5;
  var bg=ctx.createRadialGradient(W/2,H*0.3,0,W/2,H*0.3,H*0.7);
  bg.addColorStop(0,'rgb('+r+','+g+','+b+')');
  bg.addColorStop(1,'rgb('+Math.floor(r*0.3)+','+Math.floor(g*0.3)+','+Math.floor(b*0.3)+')');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(p>0.05){var ga=Math.min(1,(p-0.05)/0.1)*0.12;var sg=ctx.createRadialGradient(sx,sy,0,sx,sy,80+p*40);sg.addColorStop(0,'rgba(255,220,180,'+ga+')');sg.addColorStop(0.5,'rgba(255,200,150,'+(ga*0.4)+')');sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);}
  // 云朵缓慢飘动
  for(var i=0;i<clouds.length;i++){var c=clouds[i];c.x+=c.speed*Math.sin(t*0.0003+i);if(c.x>W+c.w)c.x=-c.w;ctx.fillStyle='rgba(255,255,255,'+(c.alpha*p)+')';ctx.beginPath();ctx.ellipse(c.x,c.y,c.w*0.5,c.w*0.18,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x-c.w*0.15,c.y-3,c.w*0.35,c.w*0.15,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c.x+c.w*0.2,c.y+1,c.w*0.3,c.w*0.13,0,0,Math.PI*2);ctx.fill();}
}

function drawGround(pct,wind){
  if(pct<=0)return;
  var gndY=H*0.78,gh=Math.min(pct/100*40+8,48);
  var grd=ctx.createLinearGradient(0,gndY,0,H);
  grd.addColorStop(0,'#5a7a3a');grd.addColorStop(0.2,'#4a6a2e');grd.addColorStop(0.5,'#3d5a25');grd.addColorStop(1,'#2a3d18');
  ctx.fillStyle=grd;ctx.fillRect(0,gndY,W,H-gndY);
  // 固定草形 + 整体微风偏移 (不再每帧Math.random)
  ctx.strokeStyle='#6a9a4a';ctx.lineWidth=1.5;
  for(var i=0;i<grassData.length;i++){
    var g=grassData[i];if(g.x>W)break;
    var h=gh*(0.3+g.h/48*0.7);
    var wx=Math.sin(t*0.0008+g.x*0.01+wind)*1.5;
    ctx.beginPath();ctx.moveTo(g.x,gndY);
    ctx.quadraticCurveTo(g.x+wx+g.curve1,gndY-h*0.5,g.x+wx*1.5+g.curve2,gndY-h);
    ctx.stroke();
  }
  var sh=ctx.createRadialGradient(W/2,gndY+5,0,W/2,gndY+5,40+pct*0.3);
  sh.addColorStop(0,'rgba(0,0,0,0.15)');sh.addColorStop(1,'transparent');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(W/2,gndY+5,40+pct*0.3,0,Math.PI*2);ctx.fill();
}

function drawTrunk(pct,t,wind){
  if(pct<=0)return;
  var gndY=H*0.78,maxH=H*0.35,th=pct*maxH,bw=8+pct*8,tw=2+pct*3,cx=W/2,by=gndY-th;
  ctx.beginPath();
  ctx.moveTo(cx-bw/2,gndY);
  ctx.quadraticCurveTo(cx-bw/4+wind,gndY-th*0.5,cx-tw/2+wind*0.5,by);
  ctx.quadraticCurveTo(cx+tw/2+wind*0.5,by,cx+bw/4+wind,gndY-th*0.3);
  ctx.quadraticCurveTo(cx+bw/2,gndY,cx+bw/2,gndY);
  ctx.closePath();
  var tg=ctx.createLinearGradient(cx-bw/2,gndY,cx+bw/2,gndY);
  tg.addColorStop(0,'#5a3a1a');tg.addColorStop(0.3,'#7a5a2a');tg.addColorStop(0.5,'#8a6a3a');tg.addColorStop(0.7,'#7a5a2a');tg.addColorStop(1,'#4a2a10');
  ctx.fillStyle=tg;ctx.fill();
  if(pct>0.1){ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=0.5;for(var i=0;i<5;i++){var lx=cx+(Math.random()-0.5)*bw*0.6,ly=gndY-Math.random()*th*0.6;ctx.beginPath();ctx.moveTo(lx,ly);ctx.quadraticCurveTo(lx+(Math.random()-0.5)*4,ly-Math.random()*10,lx+(Math.random()-0.5)*3,ly-Math.random()*15);ctx.stroke();}}
}

function drawBranches(pct,t,wind){
  if(pct<10)return;
  var gndY=H*0.78,maxH=H*0.35,th=pct*maxH,cx=W/2,topY=gndY-th;
  var bc=Math.min(4,Math.floor(pct/15));
  for(var i=0;i<bc;i++){
    var ang=-Math.PI/2+(i%2===0?0.5:-0.5)+(Math.random()-0.5)*0.3,len=40+Math.random()*50,tk=3+Math.random()*2,by=topY+th*(0.2+Math.random()*0.4);
    ctx.beginPath();ctx.moveTo(cx,by);
    ctx.quadraticCurveTo(cx+Math.cos(ang)*len*0.5+wind*0.3,by+Math.sin(ang)*len*0.5-5,cx+Math.cos(ang)*len+wind*0.6,by+Math.sin(ang)*len-10);
    ctx.strokeStyle='#6a4a2a';ctx.lineWidth=tk;ctx.lineCap='round';ctx.stroke();
    if(pct>30){drawBranch(cx+Math.cos(ang)*len+wind*0.6,by+Math.sin(ang)*len-10,ang+(Math.random()-0.5)*0.5,len*(0.3+Math.random()*0.2),tk*0.5,1,3,pct,t,wind);}
  }
}

function drawBranch(cx,cy,ang,len,tk,depth,maxD,pct,t,wind){
  if(depth>maxD||pct<depth*15||len<5)return;
  var sway=wind*(1-depth*0.15),ex=cx+Math.cos(ang+sway*0.03)*len,ey=cy+Math.sin(ang+sway*0.03)*len;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.quadraticCurveTo(cx+Math.cos(ang+sway*0.02)*len*0.5,cy+Math.sin(ang+sway*0.02)*len*0.5-2,ex,ey);
  ctx.strokeStyle='#6a4a2a';ctx.lineWidth=Math.max(0.5,tk);ctx.lineCap='round';ctx.stroke();
  var children=Math.min(2,Math.floor(pct/30));
  for(var i=0;i<children;i++){var na=ang+(i===0?0.4:-0.4)+(Math.random()-0.5)*0.2,nl=len*(0.6+Math.random()*0.2),nt=Math.max(0.5,tk*(0.5+Math.random()*0.2));drawBranch(ex,ey,na,nl,nt,depth+1,maxD,pct,t,wind);}
}

function drawCanopy(pct,t,wind){
  if(pct<15)return;
  var sp=Math.min(1,pct/100),gndY=H*0.78,maxH=H*0.35,cx=W/2,topY=gndY-maxH*sp,spread=sp*120,cy=topY-30*sp;
  var grd=ctx.createRadialGradient(cx+wind,cy,0,cx+wind,cy,spread);
  grd.addColorStop(0,'rgba(80,160,60,'+(0.2*sp)+')');grd.addColorStop(0.5,'rgba(60,140,50,'+(0.15*sp)+')');grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx+wind,cy,spread,0,Math.PI*2);ctx.fill();
  for(var i=0;i<leafParticles.length;i++){
    var lp=leafParticles[i],dist=lp.baseDist*sp,angle=lp.baseAngle+Math.sin(t*0.001*lp.swaySpeed+lp.swayPhase)*lp.swayAmp*0.02;
    var lx=cx+Math.cos(angle)*dist+wind*0.5,ly=cy+Math.sin(angle)*dist*0.6-10;
    if(ly>gndY-20)continue;
    var alpha=lp.alpha*Math.min(1,(sp-0.15)/0.2)*sp;if(alpha<0.01)continue;
    ctx.save();ctx.translate(lx,ly);ctx.rotate(lp.rotation+t*0.001*lp.rotSpeed);ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.ellipse(0,0,lp.size*0.5,lp.size*0.7,0,0,Math.PI*2);ctx.fillStyle='hsl('+lp.hue+','+lp.sat+'%,'+lp.light+'%)';ctx.fill();ctx.restore();
  }
  if(sp>0.5){var ha=(sp-0.5)*0.15;var hl=ctx.createRadialGradient(cx+wind-spread*0.2,cy-spread*0.3,0,cx+wind-spread*0.2,cy-spread*0.3,spread*0.4);hl.addColorStop(0,'rgba(255,255,200,'+ha+')');hl.addColorStop(1,'transparent');ctx.fillStyle=hl;ctx.beginPath();ctx.arc(cx+wind-spread*0.2,cy-spread*0.3,spread*0.4,0,Math.PI*2);ctx.fill();}
}

function drawFlowers(pct,t,wind){
  if(pct<50)return;
  var bp=Math.max(0,Math.min(1,(pct-50)/30)); // 0→1 在50%-80%之间平滑绽放
  var sp=Math.min(1,pct/100),gndY=H*0.78,maxH=H*0.35,cx=W/2,topY=gndY-maxH*sp,cy=topY-30*sp,spread=sp*120;
  var fpos=[{a:0.8,d:0.6,s:1},{a:-0.6,d:0.7,s:0.9},{a:1.5,d:0.4,s:0.7},{a:-1.2,d:0.5,s:0.8},{a:0.3,d:0.3,s:0.6}];
  for(var i=0;i<fpos.length;i++){
    var f=fpos[i],fx=cx+Math.cos(f.a+wind*0.02)*spread*f.d,fy=cy+Math.sin(f.a)*spread*f.d*0.4-5,fs=4+bp*f.s*10,alpha=bp*f.s;
    for(var j=0;j<5;j++){var pa=j*Math.PI*2/5+t*0.0005;ctx.beginPath();ctx.ellipse(fx+Math.cos(pa)*fs*0.5,fy+Math.sin(pa)*fs*0.5,fs*0.4,fs*0.6,pa,0,Math.PI*2);ctx.fillStyle='rgba(255,220,200,'+(alpha*0.8)+')';ctx.fill();}
    ctx.beginPath();ctx.arc(fx,fy,fs*0.15,0,Math.PI*2);ctx.fillStyle='rgba(255,200,50,'+(alpha*0.9)+')';ctx.fill();
  }
}

function drawAtmo(pct,t){
  var sp=Math.min(1,pct/100);
  if(MODE==='intro'||MODE==='idle'){
    for(var i=0;i<particles.length;i++){
      var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=Math.sin(t*0.001+p.phase)*0.002;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}if(p.x<-10||p.x>W+10)p.vx*=-1;
      var pa=p.alpha*Math.min(1,introElapsed/2);ctx.globalAlpha=pa;ctx.fillStyle='hsl('+p.hue+',80%,70%)';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      ctx.shadowColor='hsl('+p.hue+',80%,70%)';ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
  }
  if(MODE==='healing'&&sp>0.1){
    for(var i=0;i<fireflies.length;i++){var f=fireflies[i];f.x+=f.vx;f.y+=f.vy;if(f.y<-20||f.y>H*0.7){f.y=H*0.1+Math.random()*H*0.3;f.x=Math.random()*W;}if(f.x<-20||f.x>W+20)f.vx*=-1;f.alpha=Math.sin(t*0.001*f.flickerSpeed+f.phase)*0.3+0.3;var glow=Math.sin(t*0.001*f.flickerSpeed+f.phase)*2+3;ctx.fillStyle='rgba(255,230,150,'+(f.alpha*sp)+')';ctx.shadowColor='rgba(255,200,100,0.5)';ctx.shadowBlur=glow;ctx.beginPath();ctx.arc(f.x,f.y,f.size,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}
  }
  if(MODE==='healing'&&sp>0.5){var pa=(sp-0.5)*2;for(var i=0;i<petals.length;i++){var pt=petals[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.rotation+=pt.rotSpeed;pt.vy+=0.001;if(pt.y>H*0.85||pt.x<-20||pt.x>W+20){pt.x=Math.random()*W;pt.y=-10;pt.vx=(Math.random()-0.5)*0.5;pt.vy=0.2+Math.random()*0.3;}pt.alpha=pa*0.3;ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.rotation);ctx.globalAlpha=pt.alpha*sp;ctx.fillStyle='rgba(255,200,180,0.6)';ctx.beginPath();ctx.ellipse(0,0,pt.size,pt.size*0.5,0,0,Math.PI*2);ctx.fill();ctx.restore();}}
  if(MODE==='complete'){for(var i=0;i<8;i++){var cw=2+Math.sin(t*0.002+i)*2,crx=W/2+(Math.random()-0.5)*40;ctx.fillStyle='rgba(255,255,200,'+(0.03+Math.sin(t*0.001+i)*0.02)+')';ctx.fillRect(crx-0.5,H*0.3,cw,Math.random()*H*0.4+H*0.1);}}
}

function drawProgressText(progress,msg){
  if(progress<=0||MODE!=='healing')return;
  var sp=Math.min(1,progress/100),gndY=H*0.78;
  ctx.fillStyle='rgba(255,255,255,'+(0.5+0.3*sp)+')';ctx.font='12px -apple-system,PingFang SC,sans-serif';ctx.textAlign='center';ctx.fillText(msg||'培育中…',W/2,gndY+30);
  if(progress<100){var bw=120,bh=2;ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(W/2-bw/2,gndY+38,bw,bh);ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(W/2-bw/2,gndY+38,bw*progress/100,bh);}
  else{ctx.fillStyle='rgba(80,200,120,0.8)';ctx.font='15px -apple-system,PingFang SC,sans-serif';ctx.fillText('🌳 培育完成！',W/2,gndY+30);ctx.fillText('正在进入系统…',W/2,gndY+52);}
}

// ===== 主循环 =====
function render(t){
  POLY=t*0.001;
  var rawPct=healProgress;
  var sp=smoothPct(rawPct); // 平滑曲线后的进度值
  // 统一风向偏移（整棵树共用同一个 windAngle）
  var windAngle=Math.sin(t*0.0008)*1.5;

  drawSky(sp,t);
  if((MODE==='healing'||MODE==='complete')&&rawPct>0){
    drawGround(rawPct,windAngle);
    drawTrunk(sp,t,windAngle);
    drawBranches(sp,t,windAngle);
    drawCanopy(sp,t,windAngle);
    drawFlowers(healProgress,t,windAngle);
  }
  drawAtmo(sp,t);
  if(MODE==='healing')drawProgressText(rawPct,healMessage);

  if(MODE==='intro'||MODE==='idle'){
    introElapsed=t/1000;
    if(introElapsed>5&&!cardShown){cardShown=true;document.getElementById('mainCard').classList.add('show');setTimeout(function(){var el=document.getElementById('brandTitle');if(el)el.classList.add('glow');},1200);urlPromise=fetchTunnelUrl();}
    if(introElapsed>12){var ft=(introElapsed-12)/0.8;if(ft>=1){canvas.style.display='none';document.body.style.background='#f5f2ed';document.body.style.overflow='auto';document.body.style.minHeight='100vh';MODE='idle';return;}canvas.style.opacity=1-ft;}
  }
  requestAnimationFrame(render);
}

// ===== PWA =====
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('pwaArea').style.display='block';});
window.addEventListener('appinstalled',function(){document.getElementById('pwaBtn').textContent='✅ 已安装';document.getElementById('pwaBtn').className='pwa-btn installed';});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(r){if(r.outcome==='accepted')console.log('PWA installed');deferredPrompt=null;});}else{alert('请在浏览器菜单中点击「添加到主屏幕」');}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/lebacenter/sw.js').catch(function(){});});}

// ===== URL & 自愈 =====
function fetchTunnelUrl(){return fetch(URL_JSON+'?t='+Date.now()).then(function(r){return r.json();}).then(function(d){return d.url||'';}).catch(function(){return '';});}

btn.addEventListener('click',function(e){
  e.preventDefault();
  btn.textContent='🌱 准备种树…';
  btn.style.pointerEvents='none';
  MODE='healing';
  canvas.style.display='block';canvas.style.opacity=1;
  document.body.style.background='#121016';document.body.style.overflow='hidden';
  document.getElementById('mainCard').style.transition='opacity 0.4s ease, transform 0.6s cubic-bezier(0.34,1.56,0.64,1)';
  document.getElementById('mainCard').style.opacity='0';
  document.getElementById('mainCard').style.transform='translateY(60px) scale(0.85)';
  (urlPromise||fetchTunnelUrl()).then(function(url){
    if(url){target=url+'/gateway/';baseUrl=url;btn.setAttribute('href',target);}
    else{target=btn.getAttribute('href')||target;baseUrl=target.replace('/gateway/','');}
    healProgress=5;healMessage='正在培育种子…';doHeal();
  }).catch(function(){
    target=btn.getAttribute('href')||target;baseUrl=target.replace('/gateway/','');doHeal();
  });
});

function doHeal(){
  healProgress=5;
  fetch(baseUrl+'/api/heal',{method:'POST',signal:AbortSignal.timeout(5000)})
    .then(function(r){return r.json();})
    .then(function(d){if(d.ok)setTimeout(pollHealStatus,1000);})
    .catch(function(){healProgress=20;healMessage='连接修复端…';setTimeout(function(){healProgress=50;healMessage='更新公网地址…';setTimeout(function(){healProgress=80;healMessage='等待CDN刷新…';setTimeout(finishHealWithCdnRefresh,5000);},2000);},2000);});
}

function pollHealStatus(){
  if(healProgress>=100){finishHealWithCdnRefresh();return;}
  fetch(baseUrl+'/api/heal-status?t='+Date.now(),{signal:AbortSignal.timeout(3000)})
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.progress===undefined)return setTimeout(fallbackPoll,2000);
      healProgress=data.progress;healMessage=data.message;
      if(healProgress>=100)finishHealWithCdnRefresh();
      else if(healProgress<0){healProgress=80;healMessage='自愈遇到问题，继续尝试…';setTimeout(fallbackPoll,3000);}
      else setTimeout(pollHealStatus,1500);
    })
    .catch(function(){setTimeout(fallbackPoll,2000);});
}

var fc=0;
function fallbackPoll(){
  fc++;if(healProgress>=100){finishHealWithCdnRefresh();return;}
  if(fc<5){healProgress=Math.min(90,20+fc*15);healMessage='修复中 ('+fc+'/5)…';setTimeout(fallbackPoll,2000);}
  else{healProgress=93;healMessage='即将完成…';
    fetchTunnelUrl().then(function(nu){if(nu&&nu!==baseUrl.replace('/gateway/','')){baseUrl=nu;target=nu+'/gateway/';healProgress=100;finishHealWithCdnRefresh();}else{setTimeout(function(){healProgress=95;finishHealWithCdnRefresh();},3000);}}).catch(function(){setTimeout(function(){healProgress=95;finishHealWithCdnRefresh();},3000);});}
}

// ===== 强刷CDN + 验证门禁 =====
var cdnRefreshCount=0;
function finishHealWithCdnRefresh(){
  healProgress=100;healMessage='📡 刷新CDN缓存…';MODE='complete';
  // 第1次强刷CDN
  fetchTunnelUrl().then(function(nu){
    if(nu)target=nu+'/gateway/';
    cdnRefreshCount=1;
    healMessage='⏳ CDN刷新第1次…等待生效';
    setTimeout(cdnRefreshStep2,1500);
  }).catch(function(){
    cdnRefreshCount=1;
    setTimeout(cdnRefreshStep2,1500);
  });
}

function cdnRefreshStep2(){
  // 第2次强刷CDN
  healProgress=98;healMessage='📡 CDN刷新第2次…';
  fetchTunnelUrl().then(function(nu){
    if(nu)target=nu+'/gateway/';
    cdnRefreshCount=2;
    healMessage='🔄 对比CDN地址…';
    setTimeout(cdnVerifyFinal,1000);
  }).catch(function(){
    cdnRefreshCount=2;
    setTimeout(cdnVerifyFinal,1000);
  });
}

function cdnVerifyFinal(){
  healProgress=99;healMessage='✅ CDN刷新完成，验证连接…';
  verifyAndRedirect();
}

var verifyRetries=0;
function verifyAndRedirect(){
  var checkUrl=target||btn.getAttribute('href');
  // 先用no-cors检测可达性（不读响应，只确认地址能通）
  fetch(checkUrl,{method:'HEAD',mode:'no-cors',signal:AbortSignal.timeout(5000)})
    .then(function(){
      // no-cors下即使通也是opaque(0)，没抛异常=可达
      healProgress=100;healMessage='✅ 验证通过！即将跳转…';
      setTimeout(function(){window.location.href=target;},1500);
    })
    .catch(function(e){
      // 真正网络不通才重试
      retryVerify();
    });
}

function retryVerify(){
  verifyRetries++;
  if(verifyRetries<6){
    healProgress=94;
    healMessage='🌱 验证连接中 ('+verifyRetries+'/6)…';
    MODE='healing';
    setTimeout(verifyAndRedirect,3000);
  }else{
    healProgress=94;
    healMessage='⚠️ 连接不稳定，继续尝试…';
    MODE='healing';
    verifyRetries=0;
    setTimeout(verifyAndRedirect,5000);
  }
}

// GO!
requestAnimationFrame(render);
</script>
