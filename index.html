<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/lebacenter/manifest.json">
<title>乐吧公益中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow:hidden;width:100%;height:100%;}
body{
  background:#0a0e1a;
  display:flex;align-items:center;justify-content:center;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px;text-align:center;
}
/* ===== 开场粒子Canvas ===== */
#introCanvas{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:1;pointer-events:none;
}
/* ===== 卡片置于Canvas之上 ===== */
.card{
  background:rgba(255,255,255,0.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:28px;padding:50px 40px 36px;max-width:460px;width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.06),0 0 0 1px rgba(255,255,255,0.8);
  opacity:0;transform:scale(0.95);
  position:relative;overflow:hidden;transition:none;
  pointer-events:none;z-index:2;
}
.card.show{
  animation:cardIn 1.2s cubic-bezier(0.15,0.85,0.35,1) forwards;
  pointer-events:auto;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#8fc1b5,#6da8a0,#4785a8);
  background-size:200% 100%;animation:waveShift 4s ease-in-out infinite;}
@keyframes waveShift{0%,100%{background-position:0% 0;}50%{background-position:100% 0;}}
@keyframes cardIn{from{opacity:0;transform:scale(0.92) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
/* 白玻徽章 */
.badge-wrap{position:relative;width:80px;height:80px;margin:0 auto 8px;perspective:800px;}
.badge-glass{width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95) 0%,rgba(230,240,255,0.6) 40%,rgba(200,215,240,0.3) 70%,rgba(180,200,230,0.15) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.8);
  box-shadow:0 8px 32px rgba(71,133,168,0.12),inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(0,0,0,0.04);
  display:flex;align-items:center;justify-content:center;
  transform:rotateX(6deg) rotateY(-8deg);
  transition:transform 0.4s cubic-bezier(0.25,0.1,0.25,1);
  animation:badgeFloat 5s ease-in-out infinite 0.5s;overflow:hidden;}
.badge-logo{width:65%;height:65%;object-fit:contain;border-radius:50%;transform:translateZ(4px);}
.badge-glass::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,0.5) 30%,transparent 60%,rgba(255,255,255,0.2) 80%,transparent 100%);
  animation:badgeShimmer 4s ease-in-out infinite 0.8s;z-index:1;}
.badge-glass::after{content:'';position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(71,133,168,0.2),rgba(175,82,222,0.15),rgba(0,122,255,0.2),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:2px;
  animation:badgeSpin 6s linear infinite;}
.badge-shadow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:60px;height:12px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.06),transparent);
  animation:shadowPulse 5s ease-in-out infinite 0.5s;}
@keyframes badgeFloat{0%,100%{transform:rotateX(6deg) rotateY(-8deg) translateY(0);}50%{transform:rotateX(6deg) rotateY(-8deg) translateY(-4px);}}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:1;}50%{transform:translateX(-50%) scale(0.85);opacity:0.6;}}
@keyframes badgeShimmer{0%,100%{transform:rotate(0deg);opacity:0.5;}50%{transform:rotate(180deg);opacity:1;}}
@keyframes badgeSpin{to{transform:rotate(360deg);}}
/* 品牌文字 - 七彩渐变 */
.brand-title{font-size:clamp(30px,7.5vw,48px);font-weight:800;line-height:1.2;margin:4px 0 6px;white-space:nowrap;
  background:linear-gradient(135deg,#007AFF,#AF52DE 25%,#FF2D55 50%,#FF9500 75%,#34C759);
  background-size:200% 100%;background-position:100% 0;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:0;transform:translateY(10px) scale(0.96);
  animation:brandReveal 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards;}
@keyframes brandReveal{
  0%{opacity:0;transform:translateY(10px) scale(0.96);background-position:100% 0;}
  60%{opacity:1;transform:translateY(0) scale(1);background-position:60% 0;}
  100%{opacity:1;transform:translateY(0) scale(1);background-position:0% 0;}}
.brand-title.glow{animation:brandGlow 3s ease-in-out infinite 1.5s,brandReveal 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.3s forwards;}
@keyframes brandGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(0,122,255,0.10));}50%{filter:drop-shadow(0 0 14px rgba(175,82,222,0.25));}}
.sub-text{color:#86868b;font-size:14px;margin:4px 0 14px;opacity:0;transform:translateY(6px);
  animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 0.6s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.enter-area{opacity:0;transform:translateY(8px);
  animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 0.9s forwards;margin-top:4px;}
.enter-btn{display:inline-flex;align-items:center;gap:6px;
  padding:13px 34px;border-radius:999px;font-size:15px;font-weight:600;
  background:rgba(71,133,168,0.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(71,133,168,0.2);color:#4785a8;cursor:pointer;text-decoration:none;
  box-shadow:0 2px 12px rgba(71,133,168,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);user-select:none;position:relative;overflow:hidden;}
.enter-btn::before{content:'';position:absolute;inset:-2px;border-radius:999px;
  background:conic-gradient(from 0deg,transparent,rgba(71,133,168,0.15),rgba(175,82,222,0.1),rgba(0,122,255,0.15),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:2px;
  animation:btnSpin 4s linear infinite;}
@keyframes btnSpin{to{transform:rotate(360deg);}}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(71,133,168,0.18);}
.enter-btn:active{transform:scale(0.96);}
.bookmark-tip{color:#aeaeb2;font-size:11px;margin-top:8px;opacity:0;animation:fadeUp 0.4s ease-out 1.1s forwards;}
/* 小树修复 & Portal过渡（保留） */
.heal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.06) 0%,transparent 50%),
    linear-gradient(135deg,#f0f2f5,#e4e8ee);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:healFadeIn 0.4s ease-out;}
@keyframes healFadeIn{from{opacity:0;}to{opacity:1;}}
.heal-card{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:32px;padding:40px 44px 36px;max-width:380px;width:90%;
  box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(255,255,255,0.8);
  animation:healPop 0.5s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.heal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#4785a8);background-size:200% 100%;animation:waveShift 2s ease-in-out infinite;}
@keyframes healPop{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.tree-scene{position:relative;width:120px;height:140px;margin:0 auto 18px;}
.ground{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:8px;background:linear-gradient(90deg,#8B6914,#A0822A,#8B6914);border-radius:4px;}
.ground::after{content:'';position:absolute;top:-3px;left:10px;right:10px;height:6px;background:linear-gradient(90deg,#5a8f4c,#7cb362,#5a8f4c);border-radius:3px;animation:grassWave 2s ease-in-out infinite;}
@keyframes grassWave{0%,100%{transform:scaleX(1);}50%{transform:scaleX(1.03);}}
.trunk{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:6px;height:0;background:linear-gradient(180deg,#8B6914,#6B4F12);border-radius:3px;transform-origin:bottom center;animation:treeGrow 1.5s ease-out forwards;}
.healing .trunk{animation:treeSway 3s ease-in-out infinite;}
@keyframes treeSway{0%,100%{transform:translateX(-50%) rotate(0deg);}50%{transform:translateX(-50%) rotate(2deg);}}
.healing .leaf{animation:leafGlow 2s ease-in-out infinite;}
.healing .tree-scene::before{content:'';position:absolute;top:30px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(71,133,168,0.12),transparent);animation:auraPulse 2s ease-in-out infinite;pointer-events:none;}
@keyframes auraPulse{0%,100%{transform:translateX(-50%) scale(0.8);opacity:0.5;}50%{transform:translateX(-50%) scale(1.2);opacity:1;}}
.heal-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
.heal-sub{font-size:13px;color:#86868b;margin-bottom:12px;}
.heal-progress{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
.heal-dot{width:8px;height:8px;border-radius:50%;background:#ddd;animation:dotPulse 1.2s ease-in-out infinite;}
@keyframes dotPulse{0%,100%{background:#ddd;transform:scale(1);}50%{background:#4785a8;transform:scale(1.3);}}
.heal-status{font-size:12px;color:#aeaeb2;margin-top:8px;min-height:18px;transition:color 0.3s;}
.heal-status.ok{color:#34c759;}
.heal-status.fail{color:#ff3b30;}
.cine-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999998;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 0.15s ease;}
.cine-layer.show{opacity:1;}
.cine-dark{position:absolute;inset:0;background:rgba(10,10,20,0.92);opacity:0;animation:cineDarkIn 0.2s ease-out forwards;}
@keyframes cineDarkIn{from{opacity:0;}to{opacity:1;}}
.cine-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1),rgba(175,82,222,0.8),rgba(0,122,255,0.4),transparent);
  box-shadow:0 0 40px 20px rgba(175,82,222,0.3);animation:cineCore 0.5s cubic-bezier(0.25,0.1,0.25,1) forwards;}
.cine-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.6);animation:cineRing 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.15s forwards;}
.cine-particle{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;opacity:0;animation:partFly 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.1s forwards;}
.cine-wave{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(220,230,255,0.9) 30%,rgba(175,82,222,0.3) 60%,transparent 70%);animation:cineWave 0.6s cubic-bezier(0.25,0.1,0.25,1) 0.5s forwards;}
.cine-white{position:absolute;inset:0;background:#fff;opacity:0;animation:cineWhiteIn 0.3s ease-out 0.9s forwards;}
.cine-label{position:absolute;top:calc(50% + 60px);left:50%;transform:translateX(-50%);font-size:14px;font-weight:500;color:#86868b;letter-spacing:4px;opacity:0;animation:cineLabel 0.6s ease-out 1.0s forwards;}
@keyframes cineLabel{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.maint-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:maintFadeIn 0.25s ease-out;}
.maint-popup{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:28px;padding:36px 40px 28px;max-width:360px;width:90%;
  text-align:center;animation:maintPop 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.maint-icon{font-size:48px;margin-bottom:12px;}
.maint-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
.maint-desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:16px;}
.maint-btn{background:rgba(71,133,168,0.1);border:none;border-radius:14px;padding:10px 32px;font-size:15px;font-weight:600;color:#4785a8;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.pwa-area{margin-top:14px;padding-top:14px;opacity:0;animation:fadeUp 0.5s ease-out 5s forwards;}
.pwa-btn{background:none;border:none;font-size:12px;color:#86868b;cursor:pointer;padding:6px 14px;border-radius:8px;transition:all 0.3s;}
.pwa-btn:hover{background:rgba(0,0,0,0.04);color:#4785a8;}
.pwa-btn.installed{color:#34c759;cursor:default;}
</style>
</head>
<body>

<canvas id="introCanvas"></canvas>

<div class="card" id="mainCard">
  <div class="badge-wrap">
    <div class="badge-glass"><img class="badge-logo" src="/lebacenter/logo.png" alt="乐吧公益中心"></div>
    <div class="badge-shadow"></div>
  </div>
  <div class="brand-title" id="brandTitle">乐吧公益中心</div>
  <div class="sub-text">轻触进入 · 乐吧系统</div>
  <div class="enter-area">
    <a href="https://35d84c29.r23.cpolar.top/gateway/" class="enter-btn" id="enterBtn">进入系统</a>
    <div class="bookmark-tip">📌 收藏此页面，随时回来</div>
    <div class="pwa-area" id="pwaArea">
      <button class="pwa-btn" id="pwaBtn" onclick="installPWA()">📲 安装到主屏幕</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 🎬 微光粒子 · 12秒叙事动画
// 氛围优先：宁静→微光→粒子浮动→卡片显现→沉淀
// ============================================================

(function(){
  var canvas=document.getElementById('introCanvas');
  var ctx=canvas.getContext('2d');
  var W=window.innerWidth, H=window.innerHeight;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  
  // ===== 粒子系统（柔和飘动） =====
  var particles=[];
  var PCOUNT=Math.min(80,Math.floor(W*0.06));
  for(var i=0;i<PCOUNT;i++){
    particles.push({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-0.5)*0.25, vy:-(Math.random()*0.15+0.05),
      size:Math.random()*2.5+0.8,
      hue:38+Math.random()*12, // 暖金色
      alpha:Math.random()*0.3+0.1,
      phase:Math.random()*Math.PI*2
    });
  }
  // ===== 中央光晕阶段 =====
  var startTime=performance.now();
  var cardRevealed=false;
  
  function render(){
    var elapsed=(performance.now()-startTime)/1000;
    
    // ===== 背景渐变 =====
    var bg=ctx.createRadialGradient(W/2,H*0.4,0,W/2,H*0.4,W*0.5);
    var dark=Math.min(1,elapsed/2)*0.8+0.2;
    bg.addColorStop(0,'rgba(18,14,32,'+dark+')');
    bg.addColorStop(1,'rgba(8,6,16,'+dark+')');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    
    // ===== 中央光晕 =====
    var glowSize=Math.min(1,elapsed/3)*W*0.4;
    var glowAlpha=Math.min(1,elapsed/2)*0.06;
    var g=ctx.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,glowSize);
    g.addColorStop(0,'rgba(246,211,101,'+glowAlpha+')');
    g.addColorStop(0.6,'rgba(200,170,80,'+(glowAlpha*0.4)+')');
    g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    
    // ===== 粒子漂移 =====
    for(var i=0;i<particles.length;i++){
      var p=particles[i];
      p.x+=p.vx; p.y+=p.vy;
      p.vy+=Math.sin(performance.now()*0.001+p.phase)*0.002;
      if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}
      if(p.x<-10||p.x>W+10){p.vx*=-1;}
      // 粒子显现（前2秒渐入）
      var pAlpha=p.alpha*Math.min(1,elapsed/2);
      ctx.globalAlpha=pAlpha;
      ctx.fillStyle='hsl('+p.hue+',80%,70%)';
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      // 柔光
      ctx.shadowColor='hsl('+p.hue+',80%,70%)';
      ctx.shadowBlur=6;ctx.fill();ctx.shadowBlur=0;
    }
    ctx.globalAlpha=1;
    
    // ===== 卡片显现 =====
    if(elapsed>5 && !cardRevealed){
      cardRevealed=true;
      document.getElementById('mainCard').classList.add('show');
      setTimeout(function(){
        var t=document.getElementById('brandTitle');
        if(t) t.classList.add('glow');
      },1200);
      urlPromise=fetchTunnelUrl();
    }
    
    // ===== 12秒结束→淡出canvas =====
    if(elapsed>12){
      // 渐暗
      var fadeT=(elapsed-12)/0.8;
      if(fadeT>=1){
        canvas.style.display='none';
        document.body.style.background='radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.05) 0%,transparent 50%),linear-gradient(135deg,#f0f2f5,#e4e8ee)';
        document.body.style.overflow='auto';
        document.body.style.minHeight='100vh';
        return; // stop loop
      }
      canvas.style.opacity=1-fadeT;
    }
    
    requestAnimationFrame(render);
  }
  
  render();
})();

// ============================================================
// 🌱 小树修复 & Portal过渡（保留）
// ============================================================

var TREE_HTML='<div class="heal-overlay" id="healOverlay"><div class="heal-card" id="healCard"><div class="tree-scene"><div class="ground"></div><div class="trunk"></div><div class="branch r"></div><div class="branch l"></div><div class="leaf green r1"></div><div class="leaf light r2"></div><div class="leaf green l1"></div><div class="leaf light l2"></div><div class="drop"></div><div class="drop"></div><div class="drop"></div><div class="flower f1">🌸</div><div class="flower f2">🌼</div></div><div class="heal-title">🌱 小树正在修复…</div><div class="heal-sub">系统正在自愈，请稍等</div><div class="heal-progress"><div class="heal-dot"></div><div class="heal-dot"></div><div class="heal-dot"></div></div><div class="heal-status" id="healStatus">检测到异常，正在启动修复…</div></div></div>';

var URL_JSON='/lebacenter/url.json';
var target='';
var baseUrl='';
var btn=document.getElementById('enterBtn');
var MAX_RETRIES=12;
var retryCount=0;
var urlPromise=null;

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('pwaArea').style.display='block';});
window.addEventListener('appinstalled',function(){document.getElementById('pwaBtn').textContent='✅ 已安装';document.getElementById('pwaBtn').className='pwa-btn installed';});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(r){if(r.outcome==='accepted')console.log('PWA installed');deferredPrompt=null;});}else{alert('请在浏览器菜单中点击「添加到主屏幕」');}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/lebacenter/sw.js').catch(function(){});});}

function fetchTunnelUrl(){return fetch(URL_JSON+'?t='+Date.now()).then(function(r){return r.json();}).then(function(d){return d.url||'';}).catch(function(){return '';});}

btn.addEventListener('click',function(e){
  e.preventDefault();
  btn.textContent='⏳ 检测中...';
  btn.style.pointerEvents='none';
  (urlPromise||fetchTunnelUrl()).then(function(url){
    if(url){target=url+'/gateway/';baseUrl=url;btn.setAttribute('href',target);}
    else{target=btn.getAttribute('href')||target;baseUrl=target.replace('/gateway/','');}
    var cineDiv=document.createElement('div');
    cineDiv.className='cine-layer';
    cineDiv.innerHTML='<div class="cine-dark"></div><div class="cine-core"></div><div class="cine-ring"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-wave"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-white"></div><div class="cine-label">即将进入乐吧系统</div>';
    document.body.appendChild(cineDiv);
    requestAnimationFrame(function(){cineDiv.classList.add('show');});
    var ctrl=new AbortController();
    setTimeout(function(){ctrl.abort();},5000);
    fetch(target,{method:'HEAD',mode:'no-cors',signal:ctrl.signal})
      .then(function(){setTimeout(function(){window.location.href=target;},600);})
      .catch(function(){cineDiv.remove();showHealAnimation();});
  });
});

function showHealAnimation(){
  var div=document.createElement('div');
  div.innerHTML=TREE_HTML;
  document.body.appendChild(div.firstElementChild);
  setTimeout(function(){document.querySelector('.tree-scene').classList.add('healing');},2200);
  triggerHeal();
}
function triggerHeal(){
  var status=document.getElementById('healStatus');
  status.textContent='🔧 正在修复系统连接…';
  fetch(baseUrl+'/api/heal',{method:'POST',signal:AbortSignal.timeout(10000)})
    .then(function(r){return r.json();})
    .then(function(data){if(data.ok)status.textContent='✅ 修复完成，验证中…';else status.textContent='⚠️ 自动修复部分完成，继续验证…';startPolling();})
    .catch(function(){status.textContent='⚠️ 修复指令已发出，等待系统恢复…';urlPromise=fetchTunnelUrl();startPolling();});
}
function startPolling(){retryCount=0;pollUrl();}
function pollUrl(){
  retryCount++;
  var status=document.getElementById('healStatus');
  var card=document.getElementById('healCard');
  fetchTunnelUrl().then(function(newUrl){
    if(newUrl&&newUrl!==baseUrl.replace('/gateway/','')){baseUrl=newUrl;target=newUrl+'/gateway/';}
    fetch(baseUrl+'/gateway/',{method:'HEAD',mode:'no-cors',signal:AbortSignal.timeout(5000)})
      .then(function(){status.textContent='✅ 系统已恢复！正在跳转…';status.className='heal-status ok';card.classList.add('success');setTimeout(function(){window.location.href=target;},1200);})
      .catch(function(){if(retryCount>=MAX_RETRIES){status.textContent='❌ 暂时无法恢复';status.className='heal-status fail';document.getElementById('healOverlay').style.display='none';showMaintenancePopup();btn.textContent='🏛️ 进入乐吧系统';btn.style.pointerEvents='auto';return;}status.textContent='🔄 检测中 ('+retryCount+'/'+MAX_RETRIES+')…';setTimeout(pollUrl,5000);});
  });
}
function showMaintenancePopup(){
  var o=document.createElement('div');
  o.className='maint-overlay';
  o.innerHTML='<div class="maint-popup"><div class="maint-icon">🔧</div><div class="maint-title">系统临时维护中</div><div class="maint-desc">乐吧系统正在维护升级<br>请稍后再试</div><div class="maint-contacts">如有紧急问题请联系施老师</div><button class="maint-btn" onclick="this.parentElement.parentElement.remove()">我知道了</button></div>';
  document.body.appendChild(o);
}
</script>
</body>
</html>
