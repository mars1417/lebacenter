<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/lebacenter/manifest.json">
<title>乐吧公益中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.06) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.05) 0%,transparent 50%),
    linear-gradient(135deg,#f0f2f5,#e4e8ee);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px;text-align:center;overflow:hidden;
}
.card{
  background:rgba(255,255,255,0.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:28px;padding:50px 40px 36px;max-width:460px;width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.06),0 0 0 1px rgba(255,255,255,0.8);
  animation:cardIn 0.6s cubic-bezier(0.15,0.85,0.35,1);position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#8fc1b5,#6da8a0,#4785a8);
  background-size:200% 100%;animation:waveShift 4s ease-in-out infinite;}
@keyframes waveShift{0%,100%{background-position:0% 0;}50%{background-position:100% 0;}}
@keyframes cardIn{from{opacity:0;transform:scale(0.92) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.logo{font-size:48px;margin-bottom:6px;animation:logoBounce 2s ease-in-out infinite;}
@keyframes logoBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
/* ===== 标题文字动画 ===== */
.char-wrap{display:flex;justify-content:center;gap:4px;margin:6px 0 10px;min-height:68px;flex-wrap:wrap;}
.char{display:inline-block;font-size:52px;font-weight:800;line-height:1.2;
  background:linear-gradient(135deg,#007AFF,#AF52DE,#FF2D55,#FF9500,#34C759);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  clip-path:inset(0 100% 0 0);opacity:0;
  animation:charReveal 0.7s cubic-bezier(0.34,1.56,0.64,1) var(--d) forwards;}
@keyframes charReveal{
  0%{clip-path:inset(0 100% 0 0);transform:rotate(-10deg) scale(0.3);opacity:0;}
  60%{clip-path:inset(0 0% 0 0);transform:rotate(3deg) scale(1.12);opacity:1;}
  100%{clip-path:inset(0 0 0 0);transform:rotate(0deg) scale(1);opacity:1;}}
.char-wrap.glow .char{animation:glowPulse 2.5s ease-in-out infinite;}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(0,122,255,0.15));}50%{filter:drop-shadow(0 0 16px rgba(175,82,222,0.35));}}
.sub-text{color:#86868b;font-size:14px;margin:8px 0 16px;opacity:0;animation:fadeUp 0.6s ease-out 2.2s forwards;}
.load-track{width:180px;height:3px;background:rgba(0,0,0,0.06);border-radius:4px;margin:18px auto;overflow:hidden;opacity:0;animation:showBar 0.3s ease-out 2.2s forwards;}
.load-bar{height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#007AFF,#AF52DE,#FF2D55,#FF9500,#34C759);
  background-size:200% 100%;animation:loadFill 1.5s ease-in 2.4s forwards,gradShift 2s linear 2.4s infinite;}
@keyframes loadFill{to{width:100%;}}
@keyframes gradShift{to{background-position:200% 0;}}
@keyframes showBar{to{opacity:1;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
/* ===== 入口按钮 ===== */
.enter-area{opacity:0;animation:fadeUp 0.8s ease-out 3.5s forwards;margin-top:8px;}
.enter-btn{display:inline-flex;align-items:center;gap:8px;
  padding:14px 36px;border-radius:999px;font-size:16px;font-weight:600;
  background:rgba(71,133,168,0.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.9);color:#4785a8;cursor:pointer;text-decoration:none;
  box-shadow:0 4px 16px rgba(71,133,168,0.10),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);user-select:none;}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(71,133,168,0.20),inset 0 1px 0 rgba(255,255,255,0.9);background:rgba(71,133,168,0.18);}
.enter-btn:active{transform:scale(0.96);}
.bookmark-tip{color:#aeaeb2;font-size:11px;margin-top:10px;opacity:0;animation:fadeUp 0.6s ease-out 4.5s forwards;}
/* ===== 🌱 小树修复动画 ===== */
.heal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.06) 0%,transparent 50%),
    linear-gradient(135deg,#f0f2f5,#e4e8ee);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:healFadeIn 0.4s ease-out;}
@keyframes healFadeIn{from{opacity:0;}to{opacity:1;}}
.heal-card{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:32px;padding:40px 44px 36px;max-width:380px;width:90%;
  box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(255,255,255,0.8);
  animation:healPop 0.5s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.heal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#4785a8);background-size:200% 100%;
  animation:waveShift 2s ease-in-out infinite;}
@keyframes healPop{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
/* 小树生长动画 */
.tree-scene{position:relative;width:120px;height:140px;margin:0 auto 18px;}
.ground{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:100px;height:8px;background:linear-gradient(90deg,#8B6914,#A0822A,#8B6914);
  border-radius:4px;}
.ground::after{content:'';position:absolute;top:-3px;left:10px;right:10px;
  height:6px;background:linear-gradient(90deg,#5a8f4c,#7cb362,#5a8f4c);
  border-radius:3px;animation:grassWave 2s ease-in-out infinite;}
@keyframes grassWave{0%,100%{transform:scaleX(1);}50%{transform:scaleX(1.03);}}
.trunk{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:6px;height:0;background:linear-gradient(180deg,#8B6914,#6B4F12);
  border-radius:3px;transform-origin:bottom center;
  animation:treeGrow 1.5s ease-out forwards;}
@keyframes treeGrow{0%{height:0;}100%{height:60px;}}
/* 🌿 修复中 - 小树呼吸摇摆 */
.healing .trunk{animation:treeSway 3s ease-in-out infinite;}
@keyframes treeSway{0%,100%{transform:translateX(-50%) rotate(0deg);}50%{transform:translateX(-50%) rotate(2deg);}}
.healing .leaf{animation:leafGlow 2s ease-in-out infinite;}
@keyframes leafGlow{0%,100%{opacity:0.7;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
.healing .ground::after{animation:grassWave 1s ease-in-out infinite;}
/* 🌟 修复中 - 光晕脉动 */
.healing .tree-scene::before{content:'';position:absolute;top:30px;left:50%;transform:translateX(-50%);
  width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(71,133,168,0.12),transparent);
  animation:auraPulse 2s ease-in-out infinite;pointer-events:none;}
@keyframes auraPulse{0%,100%{transform:translateX(-50%) scale(0.8);opacity:0.5;}50%{transform:translateX(-50%) scale(1.2);opacity:1;}}
/* 树枝 */
.branch{position:absolute;width:30px;height:3px;background:#8B6914;border-radius:2px;
  left:50%;transform-origin:left center;opacity:0;animation:branchOut 0.6s ease-out 0.8s forwards;}
.branch.r{transform:translateX(-50%) rotate(-25deg);bottom:44px;}
.branch.l{transform:translateX(-50%) rotate(25deg);width:24px;bottom:28px;}
@keyframes branchOut{from{opacity:0;width:0;}to{opacity:1;width:30px;}}
.branch.l{animation-delay:1.1s;}
/* 叶子 */
.leaf{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;
  opacity:0;animation:leafAppear 0.5s ease-out forwards;}
.leaf.green{background:linear-gradient(135deg,#7cb362,#5a8f4c);}
.leaf.light{background:linear-gradient(135deg,#a8d68a,#7cb362);width:14px;height:14px;}
.leaf.r1{top:14px;left:52px;transform:rotate(-20deg);animation-delay:1.0s;}
.leaf.r2{top:6px;left:62px;transform:rotate(15deg);animation-delay:1.3s;}
.leaf.l1{top:20px;left:42px;transform:rotate(30deg);animation-delay:1.2s;}
.leaf.l2{top:28px;left:52px;transform:rotate(-10deg);animation-delay:1.5s;}
@keyframes leafAppear{from{opacity:0;transform:scale(0) rotate(0deg);}to{opacity:1;transform:scale(1) rotate(var(--r,20deg));}}
/* 💧 水滴一直下（修复中循环） */
@keyframes dropFall{0%{opacity:0;transform:translateY(0);}30%{opacity:1;}100%{opacity:0;transform:translateY(60px);}}
/* 花朵（修好了才开） */
.flower{position:absolute;opacity:0;animation:bloom 0.8s ease-out forwards;}
.flower.f1{top:2px;left:60px;animation-delay:2.0s;font-size:14px;}
.flower.f2{top:10px;left:48px;animation-delay:2.3s;font-size:10px;}
@keyframes bloom{0%{opacity:0;transform:scale(0) rotate(-30deg);}60%{opacity:1;transform:scale(1.3) rotate(10deg);}100%{opacity:1;transform:scale(1) rotate(0deg);}}
/* 状态文字 */
.heal-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
.heal-sub{font-size:13px;color:#86868b;margin-bottom:12px;}
.heal-progress{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
.heal-dot{width:8px;height:8px;border-radius:50%;background:#ddd;
  animation:dotPulse 1.2s ease-in-out infinite;}
.heal-dot:nth-child(1){animation-delay:0s;}
.heal-dot:nth-child(2){animation-delay:0.2s;}
.heal-dot:nth-child(3){animation-delay:0.4s;}
@keyframes dotPulse{0%,100%{background:#ddd;transform:scale(1);}50%{background:#4785a8;transform:scale(1.3);}}
.heal-status{font-size:12px;color:#aeaeb2;margin-top:8px;min-height:18px;transition:color 0.3s;}
.heal-status.ok{color:#34c759;}
.heal-status.fail{color:#ff3b30;}
/* 成功动画 */
.heal-card.success .tree-scene .flower{animation-delay:0.2s,0.5s;}
.heal-card.success .heal-title{color:#34c759;}
.heal-card.success .heal-status{color:#34c759;}
/* PWA */
.pwa-area{margin-top:14px;padding-top:14px;opacity:0;animation:fadeUp 0.5s ease-out 5s forwards;}
.pwa-btn{background:none;border:none;font-size:12px;color:#86868b;cursor:pointer;padding:6px 14px;border-radius:8px;transition:all 0.3s;}
.pwa-btn:hover{background:rgba(0,0,0,0.04);color:#4785a8;}
.pwa-btn.installed{color:#34c759;cursor:default;}
/* ===== 页面过渡 ===== */
.page-fade{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999998;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.06) 0%,transparent 50%),
    linear-gradient(135deg,#f0f2f5,#e4e8ee);
  pointer-events:none;opacity:0;transition:opacity 0.5s ease-out;}
.page-fade.show{opacity:1;}
.page-fade .pf-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;animation:fadeScale 0.6s ease-out;}
@keyframes fadeScale{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}100%{opacity:1;transform:translate(-50%,-50%) scale(1);}}
/* 登录页加载圈 */
.page-fade .pf-spinner{position:absolute;top:calc(50% + 40px);left:50%;transform:translateX(-50%);
  width:20px;height:20px;border:2px solid rgba(71,133,168,0.15);border-top-color:#4785a8;border-radius:50%;
  animation:pfSpin 0.8s linear infinite;opacity:0;animation-fill-mode:forwards;animation-delay:0.3s;}
@keyframes pfSpin{to{transform:translateX(-50%) rotate(360deg);}}
/* ===== 原维护弹窗 ===== */
.maint-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:maintFadeIn 0.25s ease-out;}
@keyframes maintFadeIn{from{opacity:0;}to{opacity:1;}}
.maint-popup{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:28px;padding:36px 40px 28px;max-width:360px;width:90%;
  box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(255,255,255,0.8);
  text-align:center;animation:maintPop 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.maint-popup::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#4785a8);background-size:200% 100%;animation:gradShift 2s linear infinite;}
@keyframes maintPop{from{opacity:0;transform:scale(0.92) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.maint-icon{font-size:48px;margin-bottom:12px;}
.maint-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
.maint-desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:16px;}
.maint-contact{font-size:12px;color:#999;margin-bottom:16px;}
.maint-btn{background:rgba(71,133,168,0.1);border:none;border-radius:14px;
  padding:10px 32px;font-size:15px;font-weight:600;color:#4785a8;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.maint-btn:hover{background:#4785a8;color:#fff;transform:translateY(-1px);}
.maint-btn:active{transform:scale(0.96);}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📚</div>
  <div class="char-wrap" id="charWrap">
    <span class="char" style="--d:0.0s">乐</span>
    <span class="char" style="--d:0.25s">吧</span>
    <span class="char" style="--d:0.50s">公</span>
    <span class="char" style="--d:0.75s">益</span>
    <span class="char" style="--d:1.00s">中</span>
    <span class="char" style="--d:1.25s">心</span>
  </div>
  <div class="sub-text">✨ 系统入口已就绪</div>
  <div class="load-track"><div class="load-bar"></div></div>
  <div class="enter-area">
    <a href="https://49b797be.r23.cpolar.top/gateway/" class="enter-btn" id="enterBtn">🏛️ 进入乐吧系统</a>
    <div class="bookmark-tip">📌 收藏此页面，随时回来</div>
    <div class="pwa-area" id="pwaArea">
      <button class="pwa-btn" id="pwaBtn" onclick="installPWA()">📲 安装到主屏幕</button>
    </div>
  </div>
</div>

<script>
// 字符动画
var chars = document.querySelectorAll('.char');
var total = chars.length;
var done = 0;
chars.forEach(function(el){
  el.addEventListener('animationend', function(){
    done++;
    if(done >= total) document.getElementById('charWrap').classList.add('glow');
  });
});

// 🌱 小树修复场景HTML
var TREE_HTML = '<div class="heal-overlay" id="healOverlay">' +
  '<div class="heal-card" id="healCard">' +
  '<div class="tree-scene">' +
  '<div class="ground"></div>' +
  '<div class="trunk"></div>' +
  '<div class="branch r"></div><div class="branch l"></div>' +
  '<div class="leaf green r1"></div><div class="leaf light r2"></div>' +
  '<div class="leaf green l1"></div><div class="leaf light l2"></div>' +
  '<div class="drop"></div><div class="drop"></div><div class="drop"></div>' +
  '<div class="flower f1">🌸</div><div class="flower f2">🌼</div>' +
  '</div>' +
  '<div class="heal-title">🌱 小树正在修复…</div>' +
  '<div class="heal-sub">系统正在自愈，请稍等</div>' +
  '<div class="heal-progress"><div class="heal-dot"></div><div class="heal-dot"></div><div class="heal-dot"></div></div>' +
  '<div class="heal-status" id="healStatus">检测到异常，正在启动修复…</div></div></div>';

// ===== 从url.json获取最新cpolar URL（永远可访问，github.io）=====
var URL_JSON = '/lebacenter/url.json';
var target = '';  // 动态获取，不再硬编码
var baseUrl = '';
var btn = document.getElementById('enterBtn');
var MAX_RETRIES = 12;
var retryCount = 0;

// 页面加载时先获取最新URL
function fetchTunnelUrl() {
  return fetch(URL_JSON + '?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ return d.url || ''; })
    .catch(function(){
      // url.json没拿到，尝试直接从Flask的/api/tunnel-info获取
      // 这个只能通过18888本机访问（GP Pages上跨域会失败）
      return '';
    });
}

// 预加载URL（页面展示动画期间静默完成）
var urlPromise = fetchTunnelUrl();

btn.addEventListener('click', function(e){
  e.preventDefault();
  btn.textContent = '⏳ 检测中...';
  btn.style.pointerEvents = 'none';
  
  // 先拿到URL
  urlPromise.then(function(url){
    if (url) {
      target = url + '/gateway/';
      baseUrl = url;
      btn.setAttribute('href', target);
    } else {
      // 没拿到URL，用旧的硬编码值兜底
      target = btn.getAttribute('href') || target;
      baseUrl = target.replace('/gateway/','');
    }
    
    // 插入页面过渡动画
    var fadeDiv = document.createElement('div');
    fadeDiv.className = 'page-fade';
    fadeDiv.innerHTML = '<div class="pf-icon">📚</div><div class="pf-spinner"></div>';
    document.body.appendChild(fadeDiv);
    requestAnimationFrame(function(){
      fadeDiv.classList.add('show');
    });
    
    var ctrl = new AbortController();
    setTimeout(function(){ ctrl.abort(); }, 5000);
    
    fetch(target, {method:'HEAD', mode:'no-cors', signal:ctrl.signal})
      .then(function(){
        setTimeout(function(){ window.location.href = target; }, 600);
      })
      .catch(function(){
        fadeDiv.remove();
        showHealAnimation();
      });
  });
});

function showHealAnimation(){
  var div = document.createElement('div');
  div.innerHTML = TREE_HTML;
  document.body.appendChild(div.firstElementChild);
  setTimeout(function(){
    document.querySelector('.tree-scene').classList.add('healing');
  }, 2200);
  triggerHeal();
}

function triggerHeal(){
  var status = document.getElementById('healStatus');
  status.textContent = '🔧 正在修复系统连接…';
  
  // 先用当前baseUrl调/api/heal
  fetch(baseUrl + '/api/heal', {method:'POST', signal:AbortSignal.timeout(10000)})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.ok) {
        status.textContent = '✅ 修复完成，验证中…';
      } else {
        status.textContent = '⚠️ 自动修复部分完成，继续验证…';
      }
      startPolling();
    })
    .catch(function(){
      status.textContent = '⚠️ 修复指令已发出，等待系统恢复…';
      // 同时尝试重新获取url.json（可能CDN已更新）
      urlPromise = fetchTunnelUrl();
      startPolling();
    });
}

function startPolling(){
  retryCount = 0;
  pollUrl();
}

function pollUrl(){
  retryCount++;
  var status = document.getElementById('healStatus');
  var card = document.getElementById('healCard');
  
  // 每次轮询前也尝试刷新url.json（CDN可能刚同步）
  fetchTunnelUrl().then(function(newUrl){
    if (newUrl && newUrl !== baseUrl.replace('/gateway/','')) {
      baseUrl = newUrl;
      target = newUrl + '/gateway/';
    }
    
    fetch(baseUrl + '/gateway/', {method:'HEAD', mode:'no-cors', signal:AbortSignal.timeout(5000)})
      .then(function(){
        status.textContent = '✅ 系统已恢复！正在跳转…';
        status.className = 'heal-status ok';
        card.classList.add('success');
        setTimeout(function(){ window.location.href = target; }, 1200);
      })
      .catch(function(){
        if (retryCount >= MAX_RETRIES) {
          status.textContent = '❌ 暂时无法恢复';
          status.className = 'heal-status fail';
          document.getElementById('healOverlay').style.display = 'none';
          showMaintenancePopup();
          btn.textContent = '🏛️ 进入乐吧系统';
          btn.style.pointerEvents = 'auto';
          return;
        }
        status.textContent = '🔄 检测中 (' + retryCount + '/' + MAX_RETRIES + ')…';
        setTimeout(pollUrl, 5000);
      });
  });
}

// 维护弹窗
function showMaintenancePopup(){
  var o = document.createElement('div');
  o.className = 'maint-overlay';
  o.innerHTML = '<div class="maint-popup">' +
    '<div class="maint-icon">🔧</div>' +
    '<div class="maint-title">系统临时维护中</div>' +
    '<div class="maint-desc">乐吧系统正在维护升级<br>请稍后再试</div>' +
    '<div class="maint-contact">如有紧急问题请联系施老师</div>' +
    '<button class="maint-btn" onclick="this.parentElement.parentElement.remove()">我知道了</button></div>';
  document.body.appendChild(o);
}

// PWA
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('pwaArea').style.display = 'block';
});
window.addEventListener('appinstalled', function(){
  document.getElementById('pwaBtn').textContent = '✅ 已安装';
  document.getElementById('pwaBtn').className = 'pwa-btn installed';
});
function installPWA(){
  if(deferredPrompt){ deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result){
      if(result.outcome === 'accepted') console.log('PWA installed');
      deferredPrompt = null;
    });
  } else { alert('请在浏览器菜单中点击「添加到主屏幕」'); }
}
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/lebacenter/sw.js', {scope: '/lebacenter/'});
  });
}
