<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="/lebacenter/manifest.json">
<title>乐吧公益中心</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{overflow:hidden;width:100%;height:100%;}
body{
  background:#0a0e1a;
  display:flex;align-items:center;justify-content:center;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding:20px;text-align:center;
}
#introCanvas{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  z-index:99999;pointer-events:none;
}
.card{
  background:rgba(255,255,255,0.85);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-radius:28px;padding:50px 40px 36px;max-width:460px;width:100%;
  box-shadow:0 24px 80px rgba(0,0,0,0.06),0 0 0 1px rgba(255,255,255,0.8);
  opacity:0;transform:scale(0.92) translateY(30px);
  position:relative;overflow:hidden;transition:none;
  pointer-events:none;
}
.card.show{
  animation:cardIn 0.9s cubic-bezier(0.15,0.85,0.35,1) forwards;
  pointer-events:auto;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#8fc1b5,#6da8a0,#4785a8);
  background-size:200% 100%;animation:waveShift 4s ease-in-out infinite;}
@keyframes waveShift{0%,100%{background-position:0% 0;}50%{background-position:100% 0;}}
@keyframes cardIn{from{opacity:0;transform:scale(0.88) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
.badge-wrap{position:relative;width:80px;height:80px;margin:0 auto 8px;perspective:800px;}
.badge-glass{width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,0.95) 0%,rgba(230,240,255,0.6) 40%,rgba(200,215,240,0.3) 70%,rgba(180,200,230,0.15) 100%);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,0.8);
  box-shadow:0 8px 32px rgba(71,133,168,0.12),inset 0 1px 0 rgba(255,255,255,0.9),inset 0 -1px 0 rgba(0,0,0,0.04);
  display:flex;align-items:center;justify-content:center;
  transform:rotateX(6deg) rotateY(-8deg);
  transition:transform 0.4s cubic-bezier(0.25,0.1,0.25,1);
  animation:badgeFloat 5s ease-in-out infinite 0.5s;}
.badge-glass::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,transparent 0%,rgba(255,255,255,0.5) 30%,transparent 60%,rgba(255,255,255,0.2) 80%,transparent 100%);
  animation:badgeShimmer 4s ease-in-out infinite 0.8s;}
.badge-glass::after{content:'';position:absolute;inset:-2px;border-radius:50%;
  background:conic-gradient(from 0deg,transparent,rgba(71,133,168,0.2),rgba(175,82,222,0.15),rgba(0,122,255,0.2),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:2px;
  animation:badgeSpin 6s linear infinite;}
.badge-icon{font-size:36px;font-weight:800;
  background:linear-gradient(135deg,#4785a8,#6da8a0,#8fc1b5);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  transform:translateZ(4px);}
.badge-shadow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  width:60px;height:12px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(0,0,0,0.06),transparent);
  animation:shadowPulse 5s ease-in-out infinite 0.5s;}
@keyframes badgeFloat{0%,100%{transform:rotateX(6deg) rotateY(-8deg) translateY(0);}50%{transform:rotateX(6deg) rotateY(-8deg) translateY(-4px);}}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:1;}50%{transform:translateX(-50%) scale(0.85);opacity:0.6;}}
@keyframes badgeShimmer{0%,100%{transform:rotate(0deg);opacity:0.5;}50%{transform:rotate(180deg);opacity:1;}}
@keyframes badgeSpin{to{transform:rotate(360deg);}}
.brand-title{font-size:clamp(30px,7.5vw,48px);font-weight:800;line-height:1.2;margin:4px 0 6px;white-space:nowrap;
  background:linear-gradient(135deg,#007AFF,#AF52DE 25%,#FF2D55 50%,#FF9500 75%,#34C759);
  background-size:200% 100%;background-position:100% 0;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  opacity:0;transform:translateY(10px) scale(0.96);
  animation:brandReveal 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.35s forwards;}
@keyframes brandReveal{
  0%{opacity:0;transform:translateY(10px) scale(0.96);background-position:100% 0;}
  60%{opacity:1;transform:translateY(0) scale(1);background-position:60% 0;}
  100%{opacity:1;transform:translateY(0) scale(1);background-position:0% 0;}}
.brand-title.glow{animation:brandGlow 3s ease-in-out infinite 1.5s,brandReveal 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.35s forwards;}
@keyframes brandGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(0,122,255,0.10));}50%{filter:drop-shadow(0 0 14px rgba(175,82,222,0.25));}}
.sub-text{color:#86868b;font-size:14px;margin:4px 0 14px;opacity:0;transform:translateY(6px);
  animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 0.7s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.enter-area{opacity:0;transform:translateY(8px);
  animation:fadeUp 0.5s cubic-bezier(0.25,0.1,0.25,1) 1.0s forwards;margin-top:4px;}
.enter-btn{display:inline-flex;align-items:center;gap:6px;
  padding:13px 34px;border-radius:999px;font-size:15px;font-weight:600;
  background:rgba(71,133,168,0.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(71,133,168,0.2);color:#4785a8;cursor:pointer;text-decoration:none;
  box-shadow:0 2px 12px rgba(71,133,168,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);user-select:none;position:relative;overflow:hidden;}
.enter-btn::before{content:'';position:absolute;inset:-2px;border-radius:999px;
  background:conic-gradient(from 0deg,transparent,rgba(71,133,168,0.15),rgba(175,82,222,0.1),rgba(0,122,255,0.15),transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:2px;
  animation:btnSpin 4s linear infinite;}
@keyframes btnSpin{to{transform:rotate(360deg);}}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(71,133,168,0.18);}
.enter-btn:active{transform:scale(0.96);}
.bookmark-tip{color:#aeaeb2;font-size:11px;margin-top:8px;opacity:0;animation:fadeUp 0.4s ease-out 1.2s forwards;}
.heal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.08) 0%,transparent 60%),
    radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.06) 0%,transparent 50%),
    linear-gradient(135deg,#f0f2f5,#e4e8ee);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:healFadeIn 0.4s ease-out;}
@keyframes healFadeIn{from{opacity:0;}to{opacity:1;}}
.heal-card{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:32px;padding:40px 44px 36px;max-width:380px;width:90%;
  box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(255,255,255,0.8);
  animation:healPop 0.5s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.heal-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#4785a8);background-size:200% 100%;
  animation:waveShift 2s ease-in-out infinite;}
@keyframes healPop{from{opacity:0;transform:scale(0.9) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.tree-scene{position:relative;width:120px;height:140px;margin:0 auto 18px;}
.ground{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100px;height:8px;background:linear-gradient(90deg,#8B6914,#A0822A,#8B6914);border-radius:4px;}
.ground::after{content:'';position:absolute;top:-3px;left:10px;right:10px;height:6px;background:linear-gradient(90deg,#5a8f4c,#7cb362,#5a8f4c);border-radius:3px;animation:grassWave 2s ease-in-out infinite;}
@keyframes grassWave{0%,100%{transform:scaleX(1);}50%{transform:scaleX(1.03);}}
.trunk{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:6px;height:0;background:linear-gradient(180deg,#8B6914,#6B4F12);border-radius:3px;transform-origin:bottom center;animation:treeGrow 1.5s ease-out forwards;}
@keyframes treeGrow{0%{height:0;}100%{height:60px;}}
.healing .trunk{animation:treeSway 3s ease-in-out infinite;}
@keyframes treeSway{0%,100%{transform:translateX(-50%) rotate(0deg);}50%{transform:translateX(-50%) rotate(2deg);}}
.healing .leaf{animation:leafGlow 2s ease-in-out infinite;}
@keyframes leafGlow{0%,100%{opacity:0.7;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}}
.healing .tree-scene::before{content:'';position:absolute;top:30px;left:50%;transform:translateX(-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(71,133,168,0.12),transparent);animation:auraPulse 2s ease-in-out infinite;pointer-events:none;}
@keyframes auraPulse{0%,100%{transform:translateX(-50%) scale(0.8);opacity:0.5;}50%{transform:translateX(-50%) scale(1.2);opacity:1;}}
.branch{position:absolute;width:30px;height:3px;background:#8B6914;border-radius:2px;left:50%;transform-origin:left center;opacity:0;animation:branchOut 0.6s ease-out 0.8s forwards;}
.branch.r{transform:translateX(-50%) rotate(-25deg);bottom:44px;}
.branch.l{transform:translateX(-50%) rotate(25deg);width:24px;bottom:28px;}
@keyframes branchOut{from{opacity:0;width:0;}to{opacity:1;width:30px;}}
.branch.l{animation-delay:1.1s;}
.leaf{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;opacity:0;animation:leafAppear 0.5s ease-out forwards;}
.leaf.green{background:linear-gradient(135deg,#7cb362,#5a8f4c);}
.leaf.light{background:linear-gradient(135deg,#a8d68a,#7cb362);width:14px;height:14px;}
.leaf.r1{top:14px;left:52px;transform:rotate(-20deg);animation-delay:1.0s;}
.leaf.r2{top:6px;left:62px;transform:rotate(15deg);animation-delay:1.3s;}
.leaf.l1{top:20px;left:42px;transform:rotate(30deg);animation-delay:1.2s;}
.leaf.l2{top:28px;left:52px;transform:rotate(-10deg);animation-delay:1.5s;}
@keyframes leafAppear{from{opacity:0;transform:scale(0) rotate(0deg);}to{opacity:1;transform:scale(1) rotate(var(--r,20deg));}}
.flower{position:absolute;opacity:0;animation:bloom 0.8s ease-out forwards;}
.flower.f1{top:2px;left:60px;animation-delay:2.0s;font-size:14px;}
.flower.f2{top:10px;left:48px;animation-delay:2.3s;font-size:10px;}
@keyframes bloom{0%{opacity:0;transform:scale(0) rotate(-30deg);}60%{opacity:1;transform:scale(1.3) rotate(10deg);}100%{opacity:1;transform:scale(1) rotate(0deg);}}
.heal-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:4px;}
.heal-sub{font-size:13px;color:#86868b;margin-bottom:12px;}
.heal-progress{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px;}
.heal-dot{width:8px;height:8px;border-radius:50%;background:#ddd;animation:dotPulse 1.2s ease-in-out infinite;}
.heal-dot:nth-child(1){animation-delay:0s;}
.heal-dot:nth-child(2){animation-delay:0.2s;}
.heal-dot:nth-child(3){animation-delay:0.4s;}
@keyframes dotPulse{0%,100%{background:#ddd;transform:scale(1);}50%{background:#4785a8;transform:scale(1.3);}}
.heal-status{font-size:12px;color:#aeaeb2;margin-top:8px;min-height:18px;transition:color 0.3s;}
.heal-status.ok{color:#34c759;}
.heal-status.fail{color:#ff3b30;}
.heal-card.success .tree-scene .flower{animation-delay:0.2s,0.5s;}
.heal-card.success .heal-title{color:#34c759;}
.cine-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999998;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 0.15s ease;}
.cine-layer.show{opacity:1;}
.cine-dark{position:absolute;inset:0;background:rgba(10,10,20,0.92);opacity:0;animation:cineDarkIn 0.2s ease-out forwards;}
@keyframes cineDarkIn{from{opacity:0;}to{opacity:1;}}
.cine-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1),rgba(175,82,222,0.8),rgba(0,122,255,0.4),transparent);
  box-shadow:0 0 40px 20px rgba(175,82,222,0.3);animation:cineCore 0.5s cubic-bezier(0.25,0.1,0.25,1) forwards;}
@keyframes cineCore{0%{width:4px;height:4px;opacity:0;box-shadow:0 0 10px 2px rgba(175,82,222,0.1);}
  30%{opacity:1;}
  100%{width:300px;height:300px;opacity:0;box-shadow:0 0 80px 60px rgba(175,82,222,0);}}
.cine-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;
  border:2px solid rgba(255,255,255,0.6);box-shadow:0 0 20px rgba(175,82,222,0.2),inset 0 0 20px rgba(71,133,168,0.1);
  opacity:0;animation:cineRing 0.7s cubic-bezier(0.25,0.1,0.25,1) 0.15s forwards;}
@keyframes cineRing{0%{width:10px;height:10px;opacity:0;border-width:3px;}40%{opacity:1;border-width:1px;}100%{width:180vw;height:180vw;opacity:0;border-width:0.5px;}}
.cine-particle{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;opacity:0;animation:partFly 0.8s cubic-bezier(0.25,0.1,0.25,1) 0.1s forwards;}
.cine-particle:nth-child(1){--sx:-80px;--sy:-60px;background:#FF6B35;animation-delay:0.05s;}
.cine-particle:nth-child(2){--sx:90px;--sy:-40px;background:#AF52DE;animation-delay:0.12s;}
.cine-particle:nth-child(3){--sx:-60px;--sy:70px;background:#007AFF;animation-delay:0.18s;}
.cine-particle:nth-child(4){--sx:70px;--sy:50px;background:#34C759;animation-delay:0.24s;}
.cine-particle:nth-child(5){--sx:-100px;--sy:-80px;background:#FF9500;animation-delay:0.08s;}
.cine-particle:nth-child(6){--sx:110px;--sy:80px;background:#FF2D55;animation-delay:0.20s;}
.cine-particle:nth-child(7){--sx:-40px;--sy:-100px;background:#5AC8FA;animation-delay:0.15s;}
.cine-particle:nth-child(8){--sx:50px;--sy:-90px;background:#FFD60A;animation-delay:0.10s;}
.cine-particle:nth-child(9){--sx:-90px;--sy:90px;background:#BF5AF2;animation-delay:0.22s;}
.cine-particle:nth-child(10){--sx:80px;--sy:-100px;background:#64D2FF;animation-delay:0.28s;}
@keyframes partFly{0%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(0.4);}
  30%{opacity:1;}
  100%{opacity:0;transform:translate(0,0) scale(0);}}
.cine-wave{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:0;height:0;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,1) 0%,rgba(220,230,255,0.9) 30%,rgba(175,82,222,0.3) 60%,transparent 70%);
  animation:cineWave 0.6s cubic-bezier(0.25,0.1,0.25,1) 0.5s forwards;}
@keyframes cineWave{0%{width:0;height:0;opacity:1;}
  100%{width:200vw;height:200vw;opacity:0;}}
.cine-shard{position:absolute;top:50%;left:50%;border-radius:2px;opacity:0;animation:shardBurst 0.7s ease-out 0.35s forwards;}
.cine-shard:nth-child(11){width:30px;height:4px;background:linear-gradient(90deg,rgba(255,255,255,0.6),transparent);--dx:150px;--dy:-80px;--r:45deg;}
.cine-shard:nth-child(12){width:20px;height:3px;background:linear-gradient(90deg,rgba(175,82,222,0.5),transparent);--dx:-120px;--dy:100px;--r:-30deg;}
.cine-shard:nth-child(13){width:25px;height:3px;background:linear-gradient(90deg,rgba(0,122,255,0.5),transparent);--dx:100px;--dy:120px;--r:60deg;}
.cine-shard:nth-child(14){width:18px;height:3px;background:linear-gradient(90deg,rgba(255,107,53,0.5),transparent);--dx:-140px;--dy:-60px;--r:-50deg;}
@keyframes shardBurst{0%{opacity:1;transform:translate(0,0) rotate(0deg);}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r));}}
.cine-white{position:absolute;inset:0;background:#fff;opacity:0;animation:cineWhiteIn 0.3s ease-out 0.9s forwards;}
@keyframes cineWhiteIn{from{opacity:0;}to{opacity:1;}}
.cine-label{position:absolute;top:calc(50% + 60px);left:50%;transform:translateX(-50%);font-size:14px;font-weight:500;color:#86868b;letter-spacing:4px;
  opacity:0;animation:cineLabel 0.6s ease-out 1.0s forwards;}
@keyframes cineLabel{from{opacity:0;transform:translateX(-50%) translateY(8px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.maint-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:99999;
  background:rgba(0,0,0,0.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;animation:maintFadeIn 0.25s ease-out;}
@keyframes maintFadeIn{from{opacity:0;}to{opacity:1;}}
.maint-popup{background:rgba(255,255,255,0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-radius:28px;padding:36px 40px 28px;max-width:360px;width:90%;
  box-shadow:0 24px 80px rgba(0,0,0,0.10),0 0 0 1px rgba(255,255,255,0.8);
  text-align:center;animation:maintPop 0.4s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.maint-popup::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#4785a8,#6da8a0,#4785a8);background-size:200% 100%;animation:gradShift 2s linear infinite;}
@keyframes maintPop{from{opacity:0;transform:scale(0.92) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
.maint-icon{font-size:48px;margin-bottom:12px;}
.maint-title{font-size:20px;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
.maint-desc{font-size:14px;color:#666;line-height:1.6;margin-bottom:16px;}
.maint-contact{font-size:12px;color:#999;margin-bottom:16px;}
.maint-btn{background:rgba(71,133,168,0.1);border:none;border-radius:14px;padding:10px 32px;font-size:15px;font-weight:600;color:#4785a8;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.maint-btn:hover{background:#4785a8;color:#fff;transform:translateY(-1px);}
.maint-btn:active{transform:scale(0.96);}
.pwa-area{margin-top:14px;padding-top:14px;opacity:0;animation:fadeUp 0.5s ease-out 5s forwards;}
.pwa-btn{background:none;border:none;font-size:12px;color:#86868b;cursor:pointer;padding:6px 14px;border-radius:8px;transition:all 0.3s;}
.pwa-btn:hover{background:rgba(0,0,0,0.04);color:#4785a8;}
.pwa-btn.installed{color:#34c759;cursor:default;}
</style>
</head>
<body>

<canvas id="introCanvas"></canvas>

<div class="card" id="mainCard">
  <div class="badge-wrap">
    <div class="badge-glass"><span class="badge-icon">乐</span></div>
    <div class="badge-shadow"></div>
  </div>
  <div class="brand-title" id="brandTitle">乐吧公益中心</div>
  <div class="sub-text">轻触进入 · 乐吧系统</div>
  <div class="enter-area">
    <a href="https://35d84c29.r23.cpolar.top/gateway/" class="enter-btn" id="enterBtn">进入系统</a>
    <div class="bookmark-tip">📌 收藏此页面，随时回来</div>
    <div class="pwa-area" id="pwaArea">
      <button class="pwa-btn" id="pwaBtn" onclick="installPWA()">📲 安装到主屏幕</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 🎬 开场动画 · 完整叙事：宁静夜→星光绽放→花开→品牌呈现
// ============================================================

var CONFIG = {
  scene1: {duration:1.8, stars:120},  // 宁静夜：慢慢看星空
  scene2: {duration:2.2, particles:150, hueMin:38, hueMax:50, sat:100, lightMin:60, lightMax:85, sizeMin:2, sizeMax:5},
  scene3: {duration:2.8, petalCount:120, staggerMax:0.4}, // 花开：从容绽放
  scene4: {duration:3.2, text:'乐吧公益中心', fontSize:76, charGap:86, staggerDelay:0.18, sweepDuration:0.8} // 聚字：逐字呈现+扫描
};  // 总计≈10s

// 缓动函数
function cubicBezier(t, p1x,p1y,p2x,p2y){
  var cx=3*p1x, bx=3*(p2x-p1x)-cx, ax=1-cx-bx;
  var cy=3*p1y, by=3*(p2y-p1y)-cy, ay=1-cy-by;
  for(var x=t,i=0;i<10;i++){var f=((ax*x+bx)*x+cx)*x;var df=(3*ax*x+2*bx)*x+cx;if(Math.abs(df)>1e-10) x-=f/df;else break;}
  return ((ay*x+by)*x+cy)*x;
}
function easeApple(t){return cubicBezier(t,0.42,0,0.58,1);}
function easeGentleOut(t){return cubicBezier(t,0.16,0.84,0.44,1);}
function easeFadeIn(t){return cubicBezier(t,0.4,0,0.2,1);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}

// ===== Scene基类 =====
function Scene(name,duration,config){
  this.name=name;this.duration=duration;this.config=config;
  this.startTime=0;this.done=false;
}
Scene.prototype.init=function(ctx,w,h){};
Scene.prototype.render=function(ctx,w,h,progress){};

// ===== Scene 1: 宁静夜空 =====
function NightSkyScene(cfg){
  Scene.call(this,'nightSky',cfg.duration,cfg);
  this.stars=[];
}
NightSkyScene.prototype=Object.create(Scene.prototype);
NightSkyScene.prototype.init=function(ctx,w,h){
  var c=this.config;
  for(var i=0;i<c.stars;i++) this.stars.push({
    x:rand(0,w),y:rand(0,h),size:rand(0.5,2.2),
    twinkle:rand(0.02,0.06),phase:rand(0,Math.PI*2),
    bright:rand(0.3,0.9)
  });
};
NightSkyScene.prototype.render=function(ctx,w,h,progress){
  var t=progress;
  var r=lerp(10,22,t);var g=lerp(14,16,t);var b=lerp(26,40,t);
  var grad=ctx.createRadialGradient(w*0.5,h*0.35,0,w*0.5,h*0.35,w*0.7);
  grad.addColorStop(0,'rgb('+r+','+g+','+b+')');
  grad.addColorStop(1,'rgb(10,8,20)');
  ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  var now=performance.now()/1000;
  for(var i=0;i<this.stars.length;i++){
    var s=this.stars[i];
    var op=s.bright*0.4+s.bright*0.6*Math.sin(now*s.twinkle+s.phase);
    ctx.globalAlpha=Math.max(0.1,op);
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  // 月牙
  ctx.globalAlpha=0.1+0.06*Math.sin(now*0.3);
  ctx.fillStyle='#f6d365';
  ctx.beginPath();ctx.arc(w*0.82,h*0.15,16,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
};

// ===== Scene 2: 星光绽放 =====
function StarBurstScene(cfg){
  Scene.call(this,'starBurst',cfg.duration,cfg);
  this.particles=[];
}
StarBurstScene.prototype=Object.create(Scene.prototype);
StarBurstScene.prototype.init=function(ctx,w,h){
  var c=this.config;
  for(var i=0;i<c.particles;i++){
    var angle=rand(0,Math.PI*2);
    this.particles.push({
      angle:angle,
      dist:rand(20,w*0.38),
      size:rand(c.sizeMin,c.sizeMax),
      hue:rand(c.hueMin,c.hueMax),
      light:rand(c.lightMin,c.lightMax),
      phase:rand(0,Math.PI*2)
    });
  }
};
StarBurstScene.prototype.render=function(ctx,w,h,progress){
  var t=easeGentleOut(Math.min(progress,1));
  var cx=w/2,cy=h*0.40;
  // 柔和光晕
  var glow=ctx.createRadialGradient(cx,cy,0,cx,cy,w*0.22);
  glow.addColorStop(0,'rgba(246,211,101,0.03)');
  glow.addColorStop(1,'transparent');
  ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
  var now=performance.now()/1000;
  for(var i=0;i<this.particles.length;i++){
    var p=this.particles[i];
    var d=p.dist*t;
    var x=cx+Math.cos(p.angle)*d;
    var y=cy+Math.sin(p.angle)*d;
    var op=(1-t*t)*0.8+0.1;
    op*=0.6+0.4*Math.sin(now*1.5+p.phase);
    ctx.globalAlpha=Math.max(0,op);
    ctx.fillStyle='hsl('+p.hue+','+p.light+'%,'+(p.light-10)+'%)';
    ctx.beginPath();ctx.arc(x,y,p.size*lerp(0.3,1,t),0,Math.PI*2);ctx.fill();
    ctx.shadowColor='hsl('+p.hue+',80%,70%)';
    ctx.shadowBlur=5;ctx.fill();ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
};

// ===== Scene 3: 花海绽放 =====
function FlowerBloomScene(cfg){
  Scene.call(this,'flowerBloom',cfg.duration,cfg);
  this.flowers=[];
}
FlowerBloomScene.prototype=Object.create(Scene.prototype);
FlowerBloomScene.prototype.init=function(ctx,w,h){
  var c=this.config;
  var cx=w/2,cy=h*0.42;
  for(var i=0;i<c.petalCount;i++){
    var angle=rand(0,Math.PI*2);
    var d=rand(50,w*0.35);
    this.flowers.push({
      x:cx+Math.cos(angle)*d,
      y:cy+Math.sin(angle)*d*0.6,
      targetX:cx+Math.cos(angle)*d*0.35+rand(-20,20),
      targetY:cy+Math.sin(angle)*d*0.35+rand(-15,15),
      size:rand(4,9),hue:rand(38,55),
      delay:rand(0,c.staggerMax),
      phase:rand(0,Math.PI*2)
    });
  }
};
FlowerBloomScene.prototype.render=function(ctx,w,h,progress){
  var t=Math.min(progress,1);
  var now=performance.now()/1000;
  for(var i=0;i<this.flowers.length;i++){
    var f=this.flowers[i];
    var lt=Math.max(0,(t-f.delay)/(1-f.delay));
    lt=Math.min(lt,1);
    var ea=easeApple(lt);
    var x=lerp(f.x,f.targetX,ea);
    var y=lerp(f.y,f.targetY,ea);
    var op=lt<0.08?lt*12:lt>0.92?Math.max(0,1-(lt-0.92)/0.08):1;
    ctx.globalAlpha=op;
    var s=f.size*(0.2+0.8*ea);
    ctx.save();ctx.translate(x,y);
    for(var j=0;j<5;j++){
      ctx.save();ctx.rotate(j*1.256+now*0.08+f.phase);
      ctx.scale(1,0.2+0.8*Math.min(lt*2,1));
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.quadraticCurveTo(s*0.6,-s*0.7,s*1.0,-s*0.25);
      ctx.quadraticCurveTo(s*0.6,-s*0.05,0,0);
      ctx.fillStyle='hsla('+f.hue+',80%,70%,0.5)';
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
};

// ===== Scene 4: 聚「乐吧公益中心」 =====
function TextRevealScene(cfg){
  Scene.call(this,'textReveal',cfg.duration,cfg);
  this.charPositions=[];
}
TextRevealScene.prototype=Object.create(Scene.prototype);
TextRevealScene.prototype.init=function(ctx,w,h){
  var c=this.config;
  var chars=c.text.split('');
  var availW=w*0.90;
  c.fontSize=Math.min(c.fontSize,Math.floor(availW/(chars.length*1.13)));
  c.charGap=Math.floor(c.fontSize*1.13);
  var startX=(w-chars.length*c.charGap)/2;
  var baseY=h*0.42;
  for(var i=0;i<chars.length;i++){
    this.charPositions.push({
      ch:chars[i],
      x:startX+i*c.charGap+c.charGap*0.5,
      y:baseY
    });
  }
};
TextRevealScene.prototype.render=function(ctx,w,h,progress){
  var t=Math.min(progress,1);
  var now=performance.now()/1000;
  // 暗色背景
  var bg=ctx.createRadialGradient(w/2,h*0.4,0,w/2,h*0.4,w*0.6);
  bg.addColorStop(0,'rgba(16,12,30,1)');
  bg.addColorStop(1,'rgba(8,6,16,1)');
  ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  // 残留花瓣微动
  ctx.globalAlpha=0.06;
  for(var i=0;i<15;i++){
    var px=((i*137+now*25)%w);
    var py=((i*97+now*20)%h);
    ctx.fillStyle='hsl(42,80%,70%)';
    ctx.beginPath();ctx.arc(px,py,1.5+Math.sin(i+now)*0.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  
  // 逐字显现
  var revealDur=0.6;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(var i=0;i<this.charPositions.length;i++){
    var ch=this.charPositions[i];
    var start=0.18*i;
    if(t>start){
      var ct=Math.min((t-start)/revealDur,1);
      var ea=easeFadeIn(ct);
      var op=Math.min(ea*1.2,1);
      var sc=0.5+0.5*ea;
      // 柔和光晕
      if(ct<0.35){
        var gs=50*(1-ct/0.35)+18;
        var go=(1-ct/0.35)*0.12;
        var g=ctx.createRadialGradient(ch.x,ch.y,0,ch.x,ch.y,gs);
        g.addColorStop(0,'rgba(255,220,120,'+go+')');
        g.addColorStop(1,'transparent');
        ctx.fillStyle=g;ctx.fillRect(ch.x-gs,ch.y-gs,gs*2,gs*2);
      }
      ctx.font='bold '+(76*sc)+'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.shadowColor='rgba(255,210,100,0.35)';
      ctx.shadowBlur=7*(1-ea)+3;
      ctx.fillStyle='#f5d66d';
      ctx.globalAlpha=op;
      ctx.fillText(ch.ch,ch.x,ch.y+2);
      ctx.shadowBlur=0;
      ctx.globalAlpha=op*0.35;
      ctx.fillStyle='#ffe8a0';
      ctx.fillText(ch.ch,ch.x-1,ch.y-1);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
  
  // 金色扫描
  var sweepS=Math.min(0.18*6+0.6+0.1,0.7);
  var sweepE=sweepS+0.6;
  if(t>sweepS&&t<sweepE){
    var sp=(t-sweepS)/(sweepE-sweepS);
    var sx=lerp(0,w,sp);
    var sg=ctx.createLinearGradient(sx-100,0,sx+100,0);
    sg.addColorStop(0,'transparent');
    sg.addColorStop(0.4,'rgba(255,220,120,0.03)');
    sg.addColorStop(0.5,'rgba(255,220,120,0.1)');
    sg.addColorStop(0.6,'rgba(255,220,120,0.03)');
    sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,w,h);
    // 扫过字符时微亮
    for(var i=0;i<this.charPositions.length;i++){
      var ch=this.charPositions[i];
      if(Math.abs(ch.x-sx)<40){
        ctx.globalAlpha=0.18*Math.max(0,1-Math.abs(ch.x-sx)/40);
        ctx.fillStyle='#fff';
        ctx.font='bold 78px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(ch.ch,ch.x,ch.y+2);
        ctx.globalAlpha=1;
      }
    }
  }
  
  // 完成态：柔和呼吸光
  if(t>sweepS-0.05){
    var br=0.5+0.5*Math.sin(now*0.5);
    for(var i=0;i<this.charPositions.length;i++){
      var ch=this.charPositions[i];
      ctx.font='bold 76px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.shadowColor='rgba(255,210,100,0.18)';
      ctx.shadowBlur=4+br*3;
      ctx.fillStyle='#f5d66d';
      ctx.globalAlpha=0.94+br*0.06;
      ctx.fillText(ch.ch,ch.x,ch.y+2);
      ctx.shadowBlur=0;
      ctx.globalAlpha=0.25;
      ctx.fillStyle='#fff5d0';
      ctx.fillText(ch.ch,ch.x-1,ch.y-1);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
  }
};

// ===== SceneManager =====
function SceneManager(){
  this.scenes=[];
  this.running=false;
  this.startTime=0;
  this.onComplete=null;
}
SceneManager.prototype.add=function(scene){this.scenes.push(scene);return this;};
SceneManager.prototype.start=function(ctx,w,h,cb){
  this.onComplete=cb;
  this.startTime=performance.now();
  this.running=true;
  for(var i=0;i<this.scenes.length;i++) this.scenes[i].init(ctx,w,h);
  var self=this;
  function loop(){
    if(!self.running) return;
    var now=performance.now();
    var elapsed=(now-self.startTime)/1000;
    var total=0;
    for(var i=0;i<self.scenes.length;i++) total+=self.scenes[i].duration;
    var acc=0;
    for(var i=0;i<self.scenes.length;i++){
      var sc=self.scenes[i];
      if(elapsed>=acc&&elapsed<acc+sc.duration)
        sc.render(ctx,w,h,(elapsed-acc)/sc.duration);
      else if(elapsed>=acc+sc.duration)
        sc.render(ctx,w,h,1);
      acc+=sc.duration;
    }
    if(elapsed<total) requestAnimationFrame(loop);
    else{self.running=false;if(self.onComplete) self.onComplete();}
  }
  loop();
};

// ===== 启动 =====
(function(){
  var canvas=document.getElementById('introCanvas');
  var ctx=canvas.getContext('2d');
  var W=window.innerWidth,H=window.innerHeight;
  var dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  
  var sm=new SceneManager();
  sm.add(new NightSkyScene(CONFIG.scene1));
  sm.add(new StarBurstScene(CONFIG.scene2));
  sm.add(new FlowerBloomScene(CONFIG.scene3));
  sm.add(new TextRevealScene(CONFIG.scene4));
  
  sm.start(ctx,W,H,function(){
    // 淡出canvas→显示卡片
    var opacity=1;
    function fade(){
      opacity-=0.03;
      if(opacity<=0){
        canvas.style.display='none';
        document.body.style.background='radial-gradient(ellipse 60% 40% at 20% 20%,rgba(0,122,255,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 30% at 80% 80%,rgba(175,82,222,0.05) 0%,transparent 50%),linear-gradient(135deg,#f0f2f5,#e4e8ee)';
        document.body.style.overflow='auto';
        document.body.style.minHeight='100vh';
        document.getElementById('mainCard').classList.add('show');
        setTimeout(function(){var t=document.getElementById('brandTitle');if(t)t.classList.add('glow');},1200);
        urlPromise=fetchTunnelUrl();
        return;
      }
      canvas.style.opacity=opacity;
      requestAnimationFrame(fade);
    }
    fade();
  });
})();

var TREE_HTML='<div class="heal-overlay" id="healOverlay"><div class="heal-card" id="healCard"><div class="tree-scene"><div class="ground"></div><div class="trunk"></div><div class="branch r"></div><div class="branch l"></div><div class="leaf green r1"></div><div class="leaf light r2"></div><div class="leaf green l1"></div><div class="leaf light l2"></div><div class="drop"></div><div class="drop"></div><div class="drop"></div><div class="flower f1">🌸</div><div class="flower f2">🌼</div></div><div class="heal-title">🌱 小树正在修复…</div><div class="heal-sub">系统正在自愈，请稍等</div><div class="heal-progress"><div class="heal-dot"></div><div class="heal-dot"></div><div class="heal-dot"></div></div><div class="heal-status" id="healStatus">检测到异常，正在启动修复…</div></div></div>';

var URL_JSON='/lebacenter/url.json';
var target='';
var baseUrl='';
var btn=document.getElementById('enterBtn');
var MAX_RETRIES=12;
var retryCount=0;
var urlPromise=null;

var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('pwaArea').style.display='block';});
window.addEventListener('appinstalled',function(){document.getElementById('pwaBtn').textContent='✅ 已安装';document.getElementById('pwaBtn').className='pwa-btn installed';});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(r){if(r.outcome==='accepted')console.log('PWA installed');deferredPrompt=null;});}else{alert('请在浏览器菜单中点击「添加到主屏幕」');}}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/lebacenter/sw.js').catch(function(){});});}

function fetchTunnelUrl(){return fetch(URL_JSON+'?t='+Date.now()).then(function(r){return r.json();}).then(function(d){return d.url||'';}).catch(function(){return '';});}

btn.addEventListener('click',function(e){
  e.preventDefault();
  btn.textContent='⏳ 检测中...';
  btn.style.pointerEvents='none';
  (urlPromise||fetchTunnelUrl()).then(function(url){
    if(url){target=url+'/gateway/';baseUrl=url;btn.setAttribute('href',target);}
    else{target=btn.getAttribute('href')||target;baseUrl=target.replace('/gateway/','');}
    var cineDiv=document.createElement('div');
    cineDiv.className='cine-layer';
    cineDiv.innerHTML='<div class="cine-dark"></div><div class="cine-core"></div><div class="cine-ring"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-particle"></div><div class="cine-wave"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-shard"></div><div class="cine-white"></div><div class="cine-label">即将进入乐吧系统</div>';
    document.body.appendChild(cineDiv);
    requestAnimationFrame(function(){cineDiv.classList.add('show');});
    var ctrl=new AbortController();
    setTimeout(function(){ctrl.abort();},5000);
    fetch(target,{method:'HEAD',mode:'no-cors',signal:ctrl.signal})
      .then(function(){setTimeout(function(){window.location.href=target;},600);})
      .catch(function(){cineDiv.remove();showHealAnimation();});
  });
});

function showHealAnimation(){
  var div=document.createElement('div');
  div.innerHTML=TREE_HTML;
  document.body.appendChild(div.firstElementChild);
  setTimeout(function(){document.querySelector('.tree-scene').classList.add('healing');},2200);
  triggerHeal();
}
function triggerHeal(){
  var status=document.getElementById('healStatus');
  status.textContent='🔧 正在修复系统连接…';
  fetch(baseUrl+'/api/heal',{method:'POST',signal:AbortSignal.timeout(10000)})
    .then(function(r){return r.json();})
    .then(function(data){if(data.ok)status.textContent='✅ 修复完成，验证中…';else status.textContent='⚠️ 自动修复部分完成，继续验证…';startPolling();})
    .catch(function(){status.textContent='⚠️ 修复指令已发出，等待系统恢复…';urlPromise=fetchTunnelUrl();startPolling();});
}
function startPolling(){retryCount=0;pollUrl();}
function pollUrl(){
  retryCount++;
  var status=document.getElementById('healStatus');
  var card=document.getElementById('healCard');
  fetchTunnelUrl().then(function(newUrl){
    if(newUrl&&newUrl!==baseUrl.replace('/gateway/','')){baseUrl=newUrl;target=newUrl+'/gateway/';}
    fetch(baseUrl+'/gateway/',{method:'HEAD',mode:'no-cors',signal:AbortSignal.timeout(5000)})
      .then(function(){status.textContent='✅ 系统已恢复！正在跳转…';status.className='heal-status ok';card.classList.add('success');setTimeout(function(){window.location.href=target;},1200);})
      .catch(function(){if(retryCount>=MAX_RETRIES){status.textContent='❌ 暂时无法恢复';status.className='heal-status fail';document.getElementById('healOverlay').style.display='none';showMaintenancePopup();btn.textContent='🏛️ 进入乐吧系统';btn.style.pointerEvents='auto';return;}status.textContent='🔄 检测中 ('+retryCount+'/'+MAX_RETRIES+')…';setTimeout(pollUrl,5000);});
  });
}
function showMaintenancePopup(){
  var o=document.createElement('div');
  o.className='maint-overlay';
  o.innerHTML='<div class="maint-popup"><div class="maint-icon">🔧</div><div class="maint-title">系统临时维护中</div><div class="maint-desc">乐吧系统正在维护升级<br>请稍后再试</div><div class="maint-contacts">如有紧急问题请联系施老师</div><button class="maint-btn" onclick="this.parentElement.parentElement.remove()">我知道了</button></div>';
  document.body.appendChild(o);
}
